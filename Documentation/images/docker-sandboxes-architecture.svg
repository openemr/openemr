<svg width="100%" viewBox="0 0 680 600" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: sans-serif; fill: #2c2c2a; }
      .th { font-size: 14px; font-weight: 500; }
      .ts { font-size: 12px; font-weight: 400; }
      .c-gray rect { fill: #F1EFE8; stroke: #5F5E5A; }
      .c-gray text { fill: #444441; }
      .c-teal rect { fill: #E1F5EE; stroke: #0F6E56; }
      .c-teal text { fill: #085041; }
      .c-purple rect { fill: #EEEDFE; stroke: #534AB7; }
      .c-purple text { fill: #3C3489; }
      .c-blue rect { fill: #E6F1FB; stroke: #185FA5; }
      .c-blue text { fill: #0C447C; }
      .c-coral rect { fill: #FAECE7; stroke: #993C1D; }
      .c-coral text { fill: #712B13; }
      .c-amber rect { fill: #FAEEDA; stroke: #854F0B; }
      .c-amber text { fill: #633806; }
    </style>
  </defs>

  <g class="c-gray">
    <rect x="20" y="20" width="640" height="560" rx="16" stroke-width="0.5"/>
    <text class="th" x="40" y="48">Host Linux</text>
    <text class="ts" x="40" y="64">Ubuntu 24.04+ · KVM · sbx CLI</text>
  </g>

  <g class="c-teal">
    <rect x="40" y="82" width="170" height="126" rx="8" stroke-width="0.5"/>
    <text class="th" x="125" y="104" text-anchor="middle">~/git/</text>
    <text class="ts" x="125" y="122" text-anchor="middle">openemr/</text>
    <text class="ts" x="125" y="138" text-anchor="middle">openemr-wt-1/</text>
    <text class="ts" x="125" y="154" text-anchor="middle">openemr-wt-2/</text>
    <text class="ts" x="125" y="170" text-anchor="middle">.worktrees.json</text>
    <text class="ts" x="125" y="186" text-anchor="middle">CLAUDE.md</text>
    <text class="ts" x="125" y="202" text-anchor="middle">pr-&lt;slug&gt;.md</text>
  </g>

  <g class="c-amber">
    <rect x="40" y="226" width="170" height="70" rx="8" stroke-width="0.5"/>
    <text class="th" x="125" y="248" text-anchor="middle">sbx proxy</text>
    <text class="ts" x="125" y="265" text-anchor="middle">holds github token</text>
    <text class="ts" x="125" y="281" text-anchor="middle">network allow / deny</text>
  </g>

  <g class="c-gray">
    <rect x="40" y="314" width="170" height="46" rx="8" stroke-width="0.5"/>
    <text class="th" x="125" y="333" text-anchor="middle">GitHub</text>
    <text class="ts" x="125" y="350" text-anchor="middle">fork pushes · PR reads</text>
  </g>

  <g class="c-gray">
    <rect x="40" y="378" width="170" height="58" rx="8" stroke-width="0.5"/>
    <text class="th" x="125" y="399" text-anchor="middle">Host browser</text>
    <text class="ts" x="125" y="416" text-anchor="middle">localhost:9301</text>
    <text class="ts" x="125" y="430" text-anchor="middle">localhost:9302</text>
  </g>

  <g class="c-gray">
    <rect x="40" y="454" width="170" height="58" rx="8" stroke-width="0.5"/>
    <text class="th" x="125" y="475" text-anchor="middle">Your own clone</text>
    <text class="ts" x="125" y="492" text-anchor="middle">outside the mount</text>
    <text class="ts" x="125" y="506" text-anchor="middle">signing · gh pr create</text>
  </g>

  <g class="c-purple">
    <rect x="240" y="82" width="200" height="300" rx="14" stroke-width="0.5"/>
    <text class="th" x="340" y="106" text-anchor="middle">microVM</text>
    <text class="ts" x="340" y="122" text-anchor="middle">own guest kernel</text>
  </g>

  <g class="c-coral">
    <rect x="258" y="138" width="164" height="50" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="158" text-anchor="middle">agent-1</text>
    <text class="ts" x="340" y="175" text-anchor="middle">openemr-wt-1</text>
  </g>

  <g class="c-blue">
    <rect x="258" y="202" width="164" height="46" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="221" text-anchor="middle">dockerd</text>
    <text class="ts" x="340" y="238" text-anchor="middle">unprivileged, not nested</text>
  </g>

  <g class="c-blue">
    <rect x="258" y="262" width="164" height="102" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="282" text-anchor="middle">demo stack</text>
    <text class="ts" x="340" y="300" text-anchor="middle">PHP · Composer</text>
    <text class="ts" x="340" y="316" text-anchor="middle">Node · MariaDB</text>
    <text class="ts" x="340" y="332" text-anchor="middle">openemr-cmd</text>
    <text class="ts" x="340" y="352" text-anchor="middle">:9301</text>
  </g>

  <g class="c-purple">
    <rect x="460" y="82" width="200" height="300" rx="14" stroke-width="0.5"/>
    <text class="th" x="560" y="106" text-anchor="middle">microVM</text>
    <text class="ts" x="560" y="122" text-anchor="middle">own guest kernel</text>
  </g>

  <g class="c-coral">
    <rect x="478" y="138" width="164" height="50" rx="8" stroke-width="0.5"/>
    <text class="th" x="560" y="158" text-anchor="middle">agent-2</text>
    <text class="ts" x="560" y="175" text-anchor="middle">openemr-wt-2</text>
  </g>

  <g class="c-blue">
    <rect x="478" y="202" width="164" height="46" rx="8" stroke-width="0.5"/>
    <text class="th" x="560" y="221" text-anchor="middle">dockerd</text>
    <text class="ts" x="560" y="238" text-anchor="middle">unprivileged, not nested</text>
  </g>

  <g class="c-blue">
    <rect x="478" y="262" width="164" height="102" rx="8" stroke-width="0.5"/>
    <text class="th" x="560" y="282" text-anchor="middle">demo stack</text>
    <text class="ts" x="560" y="300" text-anchor="middle">PHP · Composer</text>
    <text class="ts" x="560" y="316" text-anchor="middle">Node · MariaDB</text>
    <text class="ts" x="560" y="332" text-anchor="middle">openemr-cmd</text>
    <text class="ts" x="560" y="352" text-anchor="middle">:9302</text>
  </g>

  <g class="c-amber">
    <rect x="240" y="400" width="420" height="50" rx="8" stroke-width="0.5"/>
    <text class="th" x="450" y="420" text-anchor="middle">hypervisor boundary (KVM)</text>
    <text class="ts" x="450" y="437" text-anchor="middle">separate kernel per agent · no privileged container · no host Docker socket</text>
  </g>

  <g class="c-gray">
    <rect x="240" y="468" width="420" height="50" rx="8" stroke-width="0.5"/>
    <text class="th" x="450" y="488" text-anchor="middle">the mount is shared, and not a boundary</text>
    <text class="ts" x="450" y="505" text-anchor="middle">agents can write .git/config and hooks — run host git elsewhere</text>
  </g>

  <line x1="210" y1="130" x2="238" y2="150" stroke="#1D9E75" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="210" y1="120" x2="458" y2="150" stroke="#1D9E75" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text font-family="sans-serif" font-size="12" x="228" y="112" text-anchor="middle" fill="#1D9E75">rw mount</text>

  <path d="M125 296 L125 312" fill="none" stroke="#BA7517" stroke-width="1" marker-end="url(#arrow)"/>
  <path d="M212 252 L226 252 L226 172 L256 162" fill="none" stroke="#BA7517" stroke-width="1" marker-end="url(#arrow)"/>
  <text font-family="sans-serif" font-size="12" x="228" y="268" text-anchor="start" fill="#BA7517">token never</text>
  <text font-family="sans-serif" font-size="12" x="228" y="282" text-anchor="start" fill="#BA7517">enters sandbox</text>

  <path d="M256 344 L222 344 L222 400 L208 400" fill="none" stroke="#5F5E5A" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text font-family="sans-serif" font-size="12" x="196" y="372" text-anchor="end" fill="#5F5E5A">sbx ports</text>
  <text font-family="sans-serif" font-size="12" x="196" y="386" text-anchor="end" fill="#5F5E5A">--publish</text>

  <path d="M210 484 L232 484 L232 493 L238 493" fill="none" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
</svg>
