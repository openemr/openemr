  severity: ERROR
  pattern-sources:
  - pattern: $_REQUEST
  - pattern: $_GET
  - pattern: $_POST
  pattern-sinks:
  - pattern: print $...VARS;
  pattern-sanitizers:
      # Standard PHP sanitizers
  - pattern: htmlentities(...)
  - pattern: htmlspecialchars(...)
  - pattern: strip_tags(...)
  - pattern: isset(...)
  - pattern: empty(...)
  - pattern: intval(...)
  - pattern: http_build_query(...)
      # WordPress sanitizers
  - pattern: esc_html(...)
  - pattern: esc_attr(...)
  - pattern: wp_kses(...)
      # Laravel/Symfony/Twig sanitizers
  - pattern: e(...)
  - pattern: twig_escape_filter(...)
      # CodeIgniter sanitizers
  - pattern: xss_clean(...)
  - pattern: html_escape(...)
      # Drupal sanitizers
  - pattern: Html::escape(...)
  - pattern: Xss::filter(...)
      # Laminas sanitizers
  - pattern: escapeHtml(...)
  - pattern: escapeHtmlAttr(...)
      # OpenEMR sanitizers (library/htmlspecialchars.inc.php)
  - pattern: text(...)
  - pattern: attr(...)
  - pattern: attr_url(...)
  - pattern: attr_js(...)
  - pattern: js_escape(...)
  - pattern: js_url(...)
  - pattern: xlt(...)
  - pattern: xla(...)
  - pattern: xlj(...)
  - pattern: xlx(...)
  - pattern: xmlEscape(...)
  - pattern: csvEscape(...)
  - pattern: errorLogEscape(...)
      # OpenEMR display functions (library/options.inc.php) - use htmlspecialchars internally
  - pattern: generate_display_field(...)
  - pattern: generate_select_list(...)
      # OpenEMR layout editor functions (interface/super/edit_layout.php) - use attr()/text() internally
  - pattern: genLayoutOptions(...)
  - pattern: genGroupSelector(...)
      # JSON encoding - safe for HTML context (encodes special chars)
  - pattern: json_encode(...)
      # CSRF token - returns 40-char hex substring of HMAC-SHA256 (src/Common/Csrf/CsrfUtils.php)
  - pattern: CsrfUtils::collectCsrfToken(...)
  fix: print attr($...VARS);
  metadata:
    technology:
    - php
    cwe:
    - "CWE-79: Improper Neutralization of Input During Web Page Generation ('Cross-site Scripting')"
    owasp:
    - A07:2017 - Cross-Site Scripting (XSS)
    - A03:2021 - Injection
    category: security
    references:
    - https://www.php.net/manual/en/function.htmlentities.php
    - https://www.php.net/manual/en/reserved.variables.request.php
    - https://www.php.net/manual/en/reserved.variables.post.php
    - https://www.php.net/manual/en/reserved.variables.get.php
    - https://cheatsheetseries.owasp.org/cheatsheets/Cross_Site_Scripting_Prevention_Cheat_Sheet.html
    cwe2022-top25: true
    cwe2021-top25: true
    subcategory:
    - vuln
    likelihood: MEDIUM
    impact: MEDIUM
    confidence: MEDIUM

  # OpenEMR-specific SQL functions with string concatenation
  # These functions are unique to OpenEMR and not covered by p/php or p/security-audit
- id: openemr-sql-injection-sqlstatement
  patterns:
  - pattern: sqlStatement($QUERY, ...)
  - pattern-not: sqlStatement("...", ...)
  - metavariable-pattern:
      metavariable: $QUERY
      pattern-either:
      - pattern: $X . $Y
      - pattern: '"$X$Y"'
  message: Potential SQL injection in sqlStatement() - use parameterized queries
  languages: [php]
  severity: ERROR
- id: openemr-sql-injection-sqlquery
  patterns:
  - pattern: sqlQuery($QUERY, ...)
  - pattern-not: sqlQuery("...", ...)
  - metavariable-pattern:
      metavariable: $QUERY
      pattern-either:
      - pattern: $X . $Y
      - pattern: '"$X$Y"'
  message: Potential SQL injection in sqlQuery() - use parameterized queries
  languages: [php]
  severity: ERROR

  # --- JavaScript rules ---

  # Detect eval() on dynamic data (e.g. AJAX responses, variables).
  # Excludes eval of literal strings which are safe.
- id: openemr-js-eval-ajax-response
  patterns:
  - pattern: eval($DATA)
  - pattern-not: eval("...")
  message: >-
    eval() on dynamic data risks code injection. Use JSON.parse() for data
    or a safer alternative to eval().
  languages: [javascript]
  severity: ERROR
  metadata:
    technology:
    - javascript
    cwe:
    - "CWE-95: Improper Neutralization of Directives in Dynamically Evaluated Code ('Eval Injection')"
    owasp:
    - A03:2021 - Injection
    category: security
    subcategory:
    - vuln
    likelihood: MEDIUM
    impact: HIGH
    confidence: MEDIUM

  # Detect dynamic innerHTML assignments (DOM-based XSS).
  # Excludes assignments of literal strings which are safe.
- id: openemr-js-innerhtml-dynamic
  patterns:
  - pattern: $EL.innerHTML = $DATA;
  - pattern-not: $EL.innerHTML = "...";
  - pattern-not: $EL.innerHTML = '';
  message: >-
    Assigning dynamic data to innerHTML risks DOM-based XSS.
    Use textContent for text or sanitize HTML before insertion.
  languages: [javascript]
  severity: WARNING
  metadata:
    technology:
    - javascript
    cwe:
    - "CWE-79: Improper Neutralization of Input During Web Page Generation ('Cross-site Scripting')"
    owasp:
    - A03:2021 - Injection
    category: security
    subcategory:
    - vuln
    likelihood: MEDIUM
    impact: MEDIUM
    confidence: MEDIUM

  # --- Twig template rules (generic mode) ---
  # Autoescape is globally disabled in OpenEMR (TwigContainer.php:66),
  # so all escaping is manual. These rules target high-risk attribute contexts
  # where unescaped output leads to XSS.

  # Detect unescaped Twig output in href attributes.
  # Safe patterns use |e, |attr_url, or |safe_href filters.
- id: openemr-twig-unescaped-output-in-href
  pattern: href="{{ $VAR }}"
  message: >-
    Unescaped Twig variable in href attribute. Autoescape is disabled in OpenEMR.
    Use |safe_href for full URLs, |attr_url for query parameters, or |e('html_attr') to prevent XSS.
  languages: [generic]
  severity: ERROR
  paths:
    include:
    - '*.twig'
  metadata:
    technology:
    - twig
    cwe:
    - "CWE-79: Improper Neutralization of Input During Web Page Generation ('Cross-site Scripting')"
    owasp:
    - A03:2021 - Injection
    category: security
    subcategory:
    - vuln
    likelihood: HIGH
    impact: HIGH
    confidence: MEDIUM

  # Detect unescaped Twig output in form action attributes.
- id: openemr-twig-unescaped-output-in-action
  pattern: action="{{ $VAR }}"
  message: >-
    Unescaped Twig variable in action attribute. Autoescape is disabled in OpenEMR.
    Use |safe_href for full URLs, |attr_url for query parameters, or |e('html_attr') to prevent XSS.
  languages: [generic]
  severity: ERROR
  paths:
    include:
    - '*.twig'
  metadata:
    technology:
    - twig
    cwe:
    - "CWE-79: Improper Neutralization of Input During Web Page Generation ('Cross-site Scripting')"
    owasp:
    - A03:2021 - Injection
    category: security
    subcategory:
    - vuln
    likelihood: HIGH
    impact: HIGH
    confidence: MEDIUM

  # --- OAuth2 regression guards ---

  # Reads of PATH_INFO from the server superglobal are unreliable: the
  # value is only populated by apache or nginx rewriters, and remains
  # null under a front-controller setup (public/index.php under `php -S`).
  # Prefer $request->getPathInfo() which returns the equivalent value and
  # works consistently across servers. HttpRestRequest.php is excluded as
  # it is the one place that legitimately bridges the superglobal into
  # the Symfony request abstraction.
- id: openemr-oauth2-pathinfo-superglobal-read
  patterns:
  - pattern-either:
    - pattern: $REQ->server->get('PATH_INFO')
    - pattern: $REQ->server->get("PATH_INFO")
    - pattern: $_SERVER['PATH_INFO']
    - pattern: $_SERVER["PATH_INFO"]
  message: >-
    Reading PATH_INFO from the server superglobal is unreliable under a
    front-controller setup (public/index.php under `php -S`); the value
    is only populated by apache/nginx rewriters. Prefer
    $request->getPathInfo() which works consistently across servers.
  languages: [php]
  severity: ERROR
  paths:
    include:
    - '/src/RestControllers/**/*.php'
    - '/src/Common/Http/**/*.php'
    exclude:
    - '/src/Common/Http/HttpRestRequest.php'
  metadata:
    technology:
    - php
    - oauth2
    category: correctness
    confidence: HIGH

  # Reflecting the request Origin into Access-Control-Allow-Origin
  # without an allow-list check is dangerous whenever credentials are
  # allowed on the response: any origin that renders a cookie-authenticated
  # session page can issue credentialed cross-origin calls on behalf of
  # the victim. Route the Origin through CORSAllowedOriginRegistry (or
  # equivalent) before setting the header.
- id: openemr-oauth2-cors-reflect-origin-without-allowlist
  patterns:
  - pattern-either:
    - pattern: $RESP->headers->set('Access-Control-Allow-Origin', $REQ->headers->get('Origin'))
    - pattern: $RESP->headers->set("Access-Control-Allow-Origin", $REQ->headers->get("Origin"))
    - pattern: $RESP->headers->set("Access-Control-Allow-Origin", $REQ->getHeader('Origin'))
    - pattern: $RESP->headers->set("Access-Control-Allow-Origin", $REQ->getHeader('Origin')[0])
  message: >-
    Access-Control-Allow-Origin reflects the request Origin without an
    allow-list check. Combined with Access-Control-Allow-Credentials:true
    this lets any origin receive a credentialed CORS response. Route the
    Origin through CORSAllowedOriginRegistry before setting the header.
  languages: [php]
  severity: ERROR
  paths:
    include:
    - '/src/RestControllers/**/*.php'
  metadata:
    technology:
    - php
    - oauth2
    - cors
    cwe:
    - "CWE-942: Permissive Cross-domain Policy with Untrusted Domains"
    owasp:
    - A05:2021 - Security Misconfiguration
    category: security
    subcategory:
    - vuln
    likelihood: HIGH
    impact: HIGH
    confidence: HIGH

  # Non-constant-time string compare on an OAuth2 credential value lets a
  # timing side-channel leak the stored value one byte at a time. Replace
  # === / !== with hash_equals() for registration tokens, client secrets,
  # and similar.
- id: openemr-oauth2-nonconstant-time-secret-compare
  patterns:
  - pattern-either:
    - pattern: $A !== $B
    - pattern: $A === $B
  - metavariable-pattern:
      metavariable: $A
      pattern-either:
      - pattern: $X['registration_token']
      - pattern: $X['client_secret']
      - pattern: $X->getRegistrationToken()
      - pattern: $X->getClientSecret()
  message: >-
    Non-constant-time string compare on an OAuth2 credential value.
    Replace === / !== with hash_equals() to prevent timing side-channels.
  languages: [php]
  severity: ERROR
  paths:
    include:
    - '/src/Common/Auth/**/*.php'
    - '/src/RestControllers/**/*.php'
  metadata:
    technology:
    - php
    - oauth2
    cwe:
    - "CWE-208: Observable Timing Discrepancy"
    owasp:
    - A02:2021 - Cryptographic Failures
    category: security
    subcategory:
    - vuln
    likelihood: LOW
    impact: HIGH
    confidence: HIGH

  # --- XSL template rules (generic mode) ---

  # Detect disable-output-escaping in XSL transforms.
  # Bypasses XML output encoding, risky when transforming untrusted CCR/CCD data.
- id: openemr-xsl-disable-output-escaping
  pattern: disable-output-escaping="yes"
  message: >-
    disable-output-escaping bypasses XML output encoding. When transforming
    untrusted CCR/CCD data, this can lead to XSS in the rendered output.
  languages: [generic]
  severity: WARNING
  paths:
    include:
    - '*.xsl'
  metadata:
    technology:
    - xsl
    cwe:
    - "CWE-79: Improper Neutralization of Input During Web Page Generation ('Cross-site Scripting')"
    owasp:
    - A03:2021 - Injection
    category: security
    subcategory:
    - audit
    likelihood: LOW
    impact: MEDIUM
    confidence: MEDIUM
