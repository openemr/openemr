rules:
  # Override echoed-request rule from p/php to add OpenEMR sanitizers
  # This prevents false positives for OpenEMR's escaping functions like attr(), text(), xlt(), etc.
  # See: library/htmlspecialchars.inc.php for function implementations
- id: echoed-request
  mode: taint
  message: >-
    `Echo`ing user input risks cross-site scripting vulnerability.
    Use `attr()` for attribute values or `text()` for text content.
    See library/htmlspecialchars.inc.php for available sanitizers.
  languages: [php]
  severity: ERROR
  pattern-sources:
  - pattern: $_REQUEST
  - pattern: $_GET
  - pattern: $_POST
  pattern-sinks:
  - pattern: echo $...VARS;
  pattern-sanitizers:
      # Standard PHP sanitizers
  - pattern: htmlentities(...)
  - pattern: htmlspecialchars(...)
  - pattern: strip_tags(...)
  - pattern: isset(...)
  - pattern: empty(...)
  - pattern: intval(...)
  - pattern: http_build_query(...)
      # WordPress sanitizers
  - pattern: esc_html(...)
  - pattern: esc_attr(...)
  - pattern: wp_kses(...)
      # Laravel/Symfony/Twig sanitizers
  - pattern: e(...)
  - pattern: twig_escape_filter(...)
      # CodeIgniter sanitizers
  - pattern: xss_clean(...)
  - pattern: html_escape(...)
      # Drupal sanitizers
  - pattern: Html::escape(...)
  - pattern: Xss::filter(...)
      # Laminas sanitizers
  - pattern: escapeHtml(...)
  - pattern: escapeHtmlAttr(...)
      # OpenEMR sanitizers (library/htmlspecialchars.inc.php)
  - pattern: text(...)
  - pattern: attr(...)
  - pattern: attr_url(...)
  - pattern: attr_js(...)
  - pattern: js_escape(...)
  - pattern: js_url(...)
  - pattern: xlt(...)
  - pattern: xla(...)
  - pattern: xlj(...)
  - pattern: xlx(...)
  - pattern: xmlEscape(...)
  - pattern: csvEscape(...)
  - pattern: errorLogEscape(...)
      # OpenEMR display functions (library/options.inc.php) - use htmlspecialchars internally
  - pattern: generate_display_field(...)
  - pattern: generate_select_list(...)
      # OpenEMR layout editor functions (interface/super/edit_layout.php) - use attr()/text() internally
  - pattern: genLayoutOptions(...)
  - pattern: genGroupSelector(...)
      # JSON encoding - safe for HTML context (encodes special chars)
  - pattern: json_encode(...)
      # CSRF token - returns 40-char hex substring of HMAC-SHA256 (src/Common/Csrf/CsrfUtils.php)
  - pattern: CsrfUtils::collectCsrfToken(...)
  fix: echo attr($...VARS);
  metadata:
    technology:
    - php
    cwe:
    - "CWE-79: Improper Neutralization of Input During Web Page Generation ('Cross-site Scripting')"
    owasp:
    - A07:2017 - Cross-Site Scripting (XSS)
    - A03:2021 - Injection
    category: security
    references:
    - https://www.php.net/manual/en/function.htmlentities.php
    - https://www.php.net/manual/en/reserved.variables.request.php
    - https://www.php.net/manual/en/reserved.variables.post.php
    - https://www.php.net/manual/en/reserved.variables.get.php
    - https://cheatsheetseries.owasp.org/cheatsheets/Cross_Site_Scripting_Prevention_Cheat_Sheet.html
    cwe2022-top25: true
    cwe2021-top25: true
    subcategory:
    - vuln
    likelihood: MEDIUM
    impact: MEDIUM
    confidence: MEDIUM

  # Override printed-request rule from p/php to add OpenEMR sanitizers
