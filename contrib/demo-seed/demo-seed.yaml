# Demo seed file, format version 1.
#
# Read by the demo seed loader, bin/console openemr:seed-demodata (development
# only). Synthea makes the patients and their medical history; this file adds
# everything Synthea doesn't: providers, facilities, related people, extra
# addresses and phones, insurance, appointments and Visit Lists.
#
# Run it on a fresh development stack (Synthea needs Java in the container:
# `apk add openjdk17-jre` as root):
#
#   openemr-cmd e 'su-exec apache env OPENEMR_ENABLE_DEMO_SEED=1 php
#     /var/www/localhost/htdocs/openemr/bin/console openemr:seed-demodata
#     /var/www/localhost/htdocs/openemr/contrib/demo-seed/demo-seed.yaml'
#
# --validate-only checks the file without writing anything; --help lists the
# other options.
#
# Conventions
# - `key` names a record so other parts of the file can refer to it.
#   Keys are only for this file; they're never stored.
# - `percent` is the chance, 0-100, that a rule applies to a patient. The
#   loader rolls once per patient per rule, using the loader seed, with
#   patients taken in import order. Same file + same seeds = same data.
# - Ages (in `when`, `pick`) are on synthea.reference_date, so the same
#   patients match on any day. Day offsets (`ended_days_ago`, appointment
#   days) count from the day the loader runs, so a fresh stack always has
#   recent history and upcoming visits.
# - Values that go into OpenEMR lists use the list's option ids (written next
#   to each field), not their titles.
# - Made-up phones use the fictional 555-0100..0199 range with the area
#   codes in `contact_data`; made-up emails use its email_domain.
# - The loader fills each patient's marital status from Synthea (the CCDA
#   import doesn't carry it).
# - The loader rejects the file before writing anything if a key, list id or
#   selector doesn't resolve.

version: 1

# Seed for the loader's own random choices (rules, names, phone numbers).
seed: 20261119

synthea:
  count: 50
  seed: 20261119            # -s
  clinician_seed: 20261119  # -cs
  reference_date: 2026-11-19  # -r; Synthea ages and history are relative to this
  years_of_history: 5       # --exporter.years_of_history (Synthea default 10); less history, faster import
  plain_names: true         # --generate.append_numbers_to_person_names false
  # Patients are imported through the CCDA import (decided in step 1), but
  # the loader has Synthea write FHIR too. Each patient's FHIR file has the
  # same Synthea id as the CCDA, so rules can
  # use what the CCDA lacks: `synthea_marital` and `synthea_payer` (the
  # payer name in Synthea's claims).
  # Optional filters, all off by default:
  # state: Massachusetts    # positional state argument
  # city: Northampton       # positional city argument
  # ages: 0-90              # -a minAge-maxAge
  # gender: F               # -g M | F

contact_data:
  area_codes: [413, 508, 617, 781]
  email_domain: example.com

# ---------------------------------------------------------------------------
# Name pools for people the loader makes up (related people). Related people
# usually take the patient's last name; `last` is for the rest.
# ---------------------------------------------------------------------------
names:
  female: [Ana, Beth, Carmen, Diane, Elena, Fatima, Grace, Hannah, Iris, Joy, Keiko, Linda, Maya, Nora, Olivia, Priya, Rosa, Sara, Tess, Wendy]
  male: [Adam, Ben, Carlos, David, Eli, Frank, George, Hiro, Ivan, Jamal, Kevin, Luis, Marcus, Nate, Omar, Paul, Raj, Sam, Tom, Victor]
  last: [Alvarez, Brooks, Chen, Duarte, Ellis, Fischer, Gupta, Hayes, Ibarra, Jensen, Kowalski, Lindqvist, Moreau, Nguyen, Okafor, Park, Quinn, Rossi, Sato, Walsh]

