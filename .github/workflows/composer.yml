name: Composer Checks

on:
  push:
    branches:
    - master
    - rel-*
  pull_request:
    branches:
    - master
    - rel-*

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && github.event.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  composer:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        php-version: ['8.3']
    steps:
    - name: "Checkout Code"
      uses: actions/checkout@v7

    - name: Setup PHP and Composer
      uses: ./.github/actions/setup-php-composer
      with:
        php-version: ${{ matrix.php-version }}

    - name: "Validate Composer"
      shell: bash
      run: |
        set -o pipefail
        out="${RUNNER_TEMP}/composer-validate.txt"
        if composer validate --strict 2>&1 | tee "${out}"; then
          exit 0
        fi
        php bin/console --skip-globals openemr:composer-annotations validate "${out}" --annotate --summary="${GITHUB_STEP_SUMMARY}"
        exit 1

    - name: "Check Composer Normalized"
      shell: bash
      run: |
        set -o pipefail
        out="${RUNNER_TEMP}/composer-normalize.txt"
        if composer normalize --dry-run 2>&1 | tee "${out}"; then
          exit 0
        fi
        php bin/console --skip-globals openemr:composer-annotations normalize "${out}" --annotate --summary="${GITHUB_STEP_SUMMARY}"
        exit 1
