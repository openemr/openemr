name: oe-module-api-explorer smoke

on:
  push:
    branches:
    - master
    - rel-*
  pull_request:
    branches:
    - master
    - rel-*

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && github.event.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  smoke:
    name: Round-trip smoke (JWT + confidential auth-code + public PKCE)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Fix permissions for Docker uid/gid differences
      run: |
        # HACK Docker runs with a different uid/gid than the host.
        # See openemr/openemr#9233
        sudo chmod -R 0777 .

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Log Docker info
      run: |
        docker --version
        docker compose version

    - name: Login to Docker Hub
      # Authenticated pulls dodge the anonymous rate limit (same pattern as
      # inferno-test.yml). The secrets context is unavailable in `if`, so map
      # into env and gate on that; fork PRs without the secrets fall through
      # to anonymous pulls.
      if: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
      env:
        DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Install openemr-cmd
      run: |
        mkdir -p "$HOME/bin"
        curl -sSfL https://raw.githubusercontent.com/openemr/openemr-devops/master/utilities/openemr-cmd/openemr-cmd > "$HOME/bin/openemr-cmd"
        chmod +x "$HOME/bin/openemr-cmd"
        echo "$HOME/bin" >> "$GITHUB_PATH"

    - name: Boot development-easy stack
      working-directory: docker/development-easy
      run: docker compose up --detach --wait

    - name: Run oe-module-api-explorer smoke
      run: ci/api-explorer/run.sh

    - name: Upload driver-browser post-mortem on failure
      if: ${{ failure() }}
      uses: actions/upload-artifact@v7
      with:
        name: api-explorer-driver-browser-postmortem
        path: |
          tmp/driver-browser-*.png
          tmp/driver-browser-*.html
        if-no-files-found: ignore

    - name: Dump docker logs on failure
      if: ${{ failure() }}
      working-directory: docker/development-easy
      run: docker compose logs --no-color
