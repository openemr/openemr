name: Composer Require Checker

on:
  push:
    branches:
    - master
    - rel-*
    paths:
    - '**.php'
    - .composer-require-checker.json
    - .github/workflows/composer-require-checker.yml
    - composer.json
    - composer.lock
  pull_request:
    branches:
    - master
    - rel-*
    paths:
    - '**.php'
    - .composer-require-checker.json
    - .github/workflows/composer-require-checker.yml
    - composer.json
    - composer.lock
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && github.event.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  composer-require-checker:
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout Code
      uses: actions/checkout@v7

    - name: Setup PHP
      uses: ./.github/actions/setup-php-composer
      with:
        php-version: '8.3'
        extensions: bcmath, calendar, ctype, curl, dom, fileinfo, filter, gd, iconv, imagick, intl, json, ldap, libxml, mbstring, mysqli, openssl, pdo, pdo_mysql, phar, redis, session, simplexml, soap, sockets, sodium, tokenizer, xml, xmlreader, xmlwriter, xsl, zip, zlib

    - name: Run Composer Require Checker
      shell: bash
      run: |
        set -o pipefail
        out="${RUNNER_TEMP}/composer-require-checker.json"
        if composer require-checker -- --output=json | tee "${out}"; then
          echo 'Composer Require Checker found no unknown symbols.'
          exit 0
        fi
        php bin/console --skip-globals openemr:composer-annotations require-checker "${out}" --annotate --summary="${GITHUB_STEP_SUMMARY}"
        exit 1
