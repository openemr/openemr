name: Build Release
run-name: "Build Release ${{ inputs.version }}${{ inputs.dry_run && ' (dry run)' || '' }}"

# Distribution package build + GitHub Release publish for an official
# OpenEMR release. Two entry paths:
#
#   1. `workflow_dispatch` — manual invocation for one-off rebuilds
#      (or dry-run testing) by a maintainer.
#   2. `workflow_call` — called by build-release-on-tag.yml after the
#      release-prep conductor fans out the `openemr-tag`
#      repository_dispatch on release-me PR merge.
#
# The workflow assumes CHANGELOG.md is already populated for the target
# version — ChangelogMutator + CompatibilityMutator write it during the
# release-prep + release-finalize partner PRs, so the section is in
# place by the time this workflow fires post-tag. See
# openemr/openemr#12925 + openemr/openemr#12928 for the mutator
# framework, and RELEASE_PROCESS.md for the ship runbook.
#
# Migrated from openemr/openemr-devops in workstream 7 Phase 2 (PR 2b).
# Dropped from the devops shape:
#
#   * `version-bump MODE=full` fallback (Detect existing prep + Version
#     bump + Commit + Push steps). The conductor's `VersionPhpMutator`
#     (rel-scope) already clears -dev before the tag exists; by the
#     time this workflow consumes the openemr-tag dispatch, `$v_tag`
#     is clean. Manual mid-cycle dry-run niche is available via
#     release-prep or a temporarily-mutated local checkout.
#
#   * `validate_token` input + the "even during dry_run, generate +
#     verify the app token" gate it drove. `release-permissions-check.yml`
#     is the tool for testing token permissions; validate_token was a
#     duplicative safety net that predated it.
#
#   * `upload_sourceforge` + `docker_prep` + `update_website` inputs
#     and their "not yet implemented" no-op steps. Dead scope for
#     months. Also gets total workflow_dispatch inputs under GitHub's
#     10-input cap (was 11).

on:
  workflow_dispatch:
    inputs:
      version_branch:
        description: Release branch (e.g., rel-820)
        required: true
        type: string
      version:
        description: Human-readable version (e.g., 8.2.0)
        required: true
        type: string
      release_tag:
        description: Git tag (e.g., v8_2_0). Required unless dry run.
        required: false
        type: string
      milestone:
        description: GitHub milestone name for preflight check (e.g., 8.2.0)
        required: false
        type: string
      dry_run:
        description: Dry run — build only, skip release
        type: boolean
        default: true
      skip_milestone_check:
        description: Skip milestone open-items check
        type: boolean
        default: false
      skip_ghsa_check:
        description: Skip unpublished GHSA check
        type: boolean
        default: false
  workflow_call:
    inputs:
      version_branch:
        description: Release branch (e.g., rel-820)
        required: true
        type: string
      version:
        description: Human-readable version (e.g., 8.2.0)
        required: true
        type: string
      release_tag:
        description: Git tag (e.g., v8_2_0). Required unless dry run.
        required: false
        type: string
      milestone:
        description: GitHub milestone name for preflight check (e.g., 8.2.0)
        required: false
        type: string
      dry_run:
        description: Dry run — build only, skip release
        type: boolean
        default: true
      skip_milestone_check:
        description: Skip milestone open-items check
        type: boolean
        default: false
      skip_ghsa_check:
        description: Skip unpublished GHSA check
        type: boolean
        default: false

concurrency:
  group: build-release-${{ inputs.release_tag || inputs.version }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Job 1 of 3 (Phase 7c refactor): produce the release distribution
  # (tarball + zip + checksums + release-notes changelog) and upload
  # everything as a workflow artifact so downstream jobs (acceptance-
  # gate + publish) can consume it. No tag is pushed here, no GitHub
  # release is created — this job is purely the build side of build →
  # validate → publish.
  build-package:
    runs-on: ubuntu-24.04
    name: Build package
    # Cap runtime. Package assembly is under 15 min in normal runs; the
    # GitHub-default 6h ceiling would let a hung composer/npm/git step
    # burn runner minutes if something wedged.
    timeout-minutes: 30
    outputs:
      # Downstream jobs (acceptance-gate + publish) look up the artifact
      # by name and derive the tarball filename from the version. Both
      # feed reusable-workflow inputs, so expose as job outputs (not
      # env), matching GitHub Actions cross-job wiring conventions.
      release_version: ${{ inputs.version }}
      artifact_name: openemr-release-candidate-${{ inputs.version }}
    steps:
    - name: Validate inputs
      if: "!inputs.dry_run && inputs.release_tag == ''"
      run: |
        printf '::error::release_tag is required when dry_run is false\n'
        exit 1

    # Full checkout first — same rationale as build-patch.yml
    # (composite actions + composer.json need to be on disk; the
    # sparse-then-full pattern hit a git leak, see
    # openemr/openemr#13480 + #13509).
    - name: Checkout openemr release branch
      uses: actions/checkout@v7
      with:
        ref: ${{ inputs.version_branch }}
        token: ${{ github.token }}
        filter: blob:none
        fetch-depth: 1
        persist-credentials: false

    - name: Generate app token
      if: '!inputs.dry_run'
      id: app-token
      uses: ./.github/actions/generate-app-token
      with:
        client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
        private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
        owner: ${{ github.repository_owner }}
        repositories: openemr

    - name: Verify app token
      if: '!inputs.dry_run'
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token }}
      run: |
        echo "Checking app token can access openemr/openemr milestones..."
        gh api repos/openemr/openemr/milestones --jq '.[].title' | head -5
        echo 'App token verified.'

    - name: Setup PHP and Composer
      uses: ./.github/actions/setup-php-composer
      with:
        php-version: '8.5'

    - name: Install Taskfile
      uses: arduino/setup-task@v3
      with:
        version: 3.x
        repo-token: ${{ secrets.GITHUB_TOKEN }}

    - name: Preflight checks
      if: '(!inputs.skip_milestone_check && inputs.milestone != '''') || !inputs.skip_ghsa_check'
      working-directory: tools/release
      env:
        # Route inputs through env so shell-metachars in operator-
        # provided values can't break out of task-argument quoting.
        # Task itself calls shellQuote on the value again; belt +
        # suspenders.
        GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
        MILESTONE: ${{ inputs.milestone }}
        SKIP_MILESTONE: ${{ (inputs.skip_milestone_check || inputs.milestone == '') && '1' || '' }}
        SKIP_GHSA: ${{ inputs.skip_ghsa_check && '1' || '' }}
      run: >-
        task preflight
        MILESTONE="$MILESTONE"
        SKIP_MILESTONE="$SKIP_MILESTONE"
        SKIP_GHSA="$SKIP_GHSA"

    # Extract the target version's section from CHANGELOG.md for the
    # GitHub Release body + release-notes asset. Content is pre-computed
    # by ChangelogMutator + CompatibilityMutator during the release-prep
    # + release-finalize partner PRs (openemr/openemr#12925 +
    # openemr/openemr#12928) — both the noise-filtered PR list and the
    # Minimum-supported-versions block are already in place on the rel
    # branch's CHANGELOG.md by the time this workflow runs post-tag.
    - name: Extract CHANGELOG section
      working-directory: tools/release
      env:
        # Route through env so a shell-metachar in inputs.version cannot
        # break out of the task-argument quoting. Task itself calls
        # shellQuote on the value again; belt + suspenders.
        RELEASE_VERSION: ${{ inputs.version }}
      run: >-
        task changelog:extract
        VERSION="$RELEASE_VERSION"
        OPENEMR_DIR='${{ github.workspace }}'

    - name: Setup Node
      uses: actions/setup-node@v7
      with:
        node-version: '24'

    - name: Build distribution package
      working-directory: tools/release
      env:
        RELEASE_VERSION: ${{ inputs.version }}
      run: >-
        task package:assemble
        VERSION="$RELEASE_VERSION"
        OPENEMR_DIR="$GITHUB_WORKSPACE"

    - name: Generate checksums
      working-directory: tools/release
      env:
        RELEASE_VERSION: ${{ inputs.version }}
      run: |
        task checksum FILE="openemr-${RELEASE_VERSION}.tar.gz"
        task checksum FILE="openemr-${RELEASE_VERSION}.zip"

    # Upload the whole release-output dir as a single workflow-run
    # artifact so downstream jobs (acceptance-gate + publish) can
    # consume it. Artifact name embeds the version so parallel dispatch
    # runs (e.g. two different rel-branches under test) don't collide.
    # acceptance-package.yml's workflow_call flow expects the tarball
    # to be present at
    # /tmp/pr-built-tarball/openemr-<version>.tar.gz after download;
    # publish job re-downloads to read the other assets.
    #
    # Retention-days matches the previous dry-run upload behavior (7d)
    # — a maintainer inspecting a failed dispatch shouldn't have their
    # artifact evicted between the failure and the postmortem.
    - name: Upload release-output artifact
      uses: actions/upload-artifact@v7
      with:
        name: openemr-release-candidate-${{ inputs.version }}
        path: |
          tools/release/release-output/openemr-${{ inputs.version }}.tar.gz
          tools/release/release-output/openemr-${{ inputs.version }}.zip
          tools/release/release-output/changelog.md
          tools/release/release-output/*.md5
          tools/release/release-output/*.sha256
          tools/release/release-output/*.sha512
        retention-days: 7

  # Job 2 of 3 (Phase 7c): pre-publish acceptance gate. Runs the full
  # acceptance-package matrix (fresh-install, wizard-install, upgrade,
  # wizard-upgrade) against the tarball build-package just uploaded.
  # Publish job only fires if this passes.
  #
  # Skipped on dry_run — the acceptance gate exists to prevent broken
  # tarballs from reaching the GitHub releases page, so it's redundant
  # when publish is skipped. That also keeps dry-run runtime bounded
  # to just the build step.
  #
  # Runs against the release branch's copy of acceptance-package.yml
  # (@${{ inputs.version_branch }}), NOT the caller's ref. This matches
  # the shape end users would see: whatever tests the release branch
  # says are canon, run those. Downside: acceptance-package.yml has to
  # exist on the target rel-branch (rel-830+ once Phase 3.5 backports;
  # earlier branches would need this workflow_call trigger backported
  # or the acceptance-gate job disabled for those branches).
  acceptance-gate:
    name: Acceptance gate
    needs: [build-package]
    if: '!inputs.dry_run'
    uses: ./.github/workflows/acceptance-package.yml
    with:
      # Both caller_* inputs reference the SAME artifact name because
      # the release-output bundle contains BOTH openemr-<version>.tar.gz
      # AND openemr-<version>.zip (see build-package's upload-artifact
      # step). acceptance-package's per-format download step picks the
      # right file out of the bundle by matrix.format.
      caller_tarball_artifact: ${{ needs.build-package.outputs.artifact_name }}
      caller_zip_artifact: ${{ needs.build-package.outputs.artifact_name }}
      to_version: ${{ needs.build-package.outputs.release_version }}
    # Acceptance-package doesn't currently use secrets, but forward
    # them for future-proofing (e.g. if a downstream test grows a
    # secret dependency, no ops-side change needed here).
    secrets: inherit

  # Job 3 of 3 (Phase 7c): publish. Push the annotated tag, create
  # the GitHub release, and upload the artifacts. Runs ONLY if
  # acceptance-gate succeeded — a broken tarball never reaches the
  # releases page.
  #
  # Skipped on dry_run (there's no release to push to).
  #
  # Phase 10c (openemr/openemr#TBD): the ~100-line publish job body
  # was extracted into .github/workflows/reusable-publish-release.yml
  # so acceptance-only.yml can call the same publish flow from its
  # recovery path. Behavior preserved step-for-step; the only visible
  # change here is the swap from `runs-on: ... steps: ...` to `uses:`.
  publish:
    name: Publish release
    needs: [build-package, acceptance-gate]
    if: '!inputs.dry_run'
    uses: ./.github/workflows/reusable-publish-release.yml
    with:
      version: ${{ inputs.version }}
      release_tag: ${{ inputs.release_tag }}
      version_branch: ${{ inputs.version_branch }}
      artifact_name: ${{ needs.build-package.outputs.artifact_name }}
      milestone: ${{ inputs.milestone }}
    secrets: inherit
