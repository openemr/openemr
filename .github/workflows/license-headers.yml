# Checks the @license tag in file headers against .license-headers.yaml.
#
# Pull requests check only the files they change and fail on any finding.
# The weekly and manual runs scan every tracked file to report, not enforce:
# they never fail on findings, upload them to code scanning, and write a
# compliance table to the job summary. Only full scans should upload for
# master, because code scanning closes any alert missing from the latest scan.
name: License Headers

on:
  pull_request:
    branches:
    - master
    - rel-*
  schedule:
    # Run weekly on Monday at 10am UTC
  - cron: 0 10 * * 1
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && github.event.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  license-headers:
    name: License Headers
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        # --changed-since needs the merge base with the PR's base commit.
        fetch-depth: 0

    - name: Setup PHP
      uses: ./.github/actions/setup-php-composer
      with:
        php-version: '8.3'

    - name: Check changed files
      if: github.event_name == 'pull_request'
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
      run: >-
        php bin/console --skip-globals openemr:license-headers
        --changed-since="$BASE_SHA"
        --sarif=license-headers.sarif

    - name: Scan every file
      if: github.event_name != 'pull_request'
      run: >-
        php bin/console --skip-globals openemr:license-headers
        --all --report-only --quiet
        --sarif=license-headers.sarif
        --markdown="$GITHUB_STEP_SUMMARY"

    - name: Upload SARIF results
      if: always() && hashFiles('license-headers.sarif') != ''
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: license-headers.sarif
        category: license-headers
