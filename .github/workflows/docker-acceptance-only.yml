# Phase 10c (docker recovery path, 2026-07-30): docker-side parallel of
# acceptance-only.yml — dedicated workflow_dispatch entry point that
# re-runs the docker acceptance-gate against a preserved candidate tag
# on Docker Hub, and (on green) publishes automatically via the same
# reusable-docker-publish.yml docker-build-release.yml uses.
#
# The problem this solves: pre-Phase-10c, a docker-side acceptance flake
# (transient chromedriver install, wizard-install fluke, etc.) on a
# known-good multi-arch build required the operator to manually:
#   1. dispatch acceptance-docker.yml with `to_tag=<candidate-suffix>`
#   2. on green, run `docker buildx imagetools create -t <final> <candidate>`
#      for EVERY expanded tag
#   3. manually delete the candidate via the Docker Hub UI or a v2 API
#      curl (see docker-build-release.yml's cleanup-candidate job for
#      the JWT dance)
#
# Total steps: ~5-10 manual commands per recovery, with a nontrivial
# chance of typos (candidate_tag mis-transcription) or missing an
# expanded tag on step 2. docker-acceptance-only.yml collapses the
# whole flow to a single dispatch.
#
# Recovery flow (post-Phase-10c):
#   1. Operator sees docker-build-release.yml failed at acceptance-gate.
#      Copies the `candidate_tag` value from the failed build job's
#      outputs section (visible on the failed run page).
#   2. Dispatch this workflow with `candidate_tag=<value>` (optionally
#      also `source_run_id` for audit-trail context — not used at
#      runtime but shown in the run-name).
#   3. Workflow verifies candidate still exists on Docker Hub, re-runs
#      the full acceptance-docker matrix against it, and on green
#      publishes via the reusable — imagetools-alias onto each final
#      tag + cleanup the candidate.
#
# Input-shape design call: the plan doc's preferred "derive everything
# from source_run_id via gh api /repos/.../actions/runs/<id>/jobs"
# path doesn't work — GitHub's jobs endpoint doesn't expose job outputs
# (only step-level name+conclusion metadata) AND the runs endpoint
# doesn't expose workflow_dispatch inputs either (only the display
# title + event name + head SHA). Both verified 2026-07-30 against
# real docker-build-release runs' API responses.
#
# Falling back to Option (a): explicit workflow_dispatch inputs for
# the two operator-authoritative values (candidate_tag + docker_tags),
# with the other three (openemr_version_ref, image_version, build_date)
# derived from the candidate image's own OCI labels via `docker
# inspect --format`. Reduces the operator-input burden from 5 to 3
# while preserving reliability:
#   * candidate_tag + docker_tags: visible on the failed docker-build-
#     release run's page (candidate_tag as a build-job output, docker_tags
#     as the run's dispatch input) — operator copies both.
#   * source_run_id: informational only (48h age check + docker-build-
#     release.yml eligibility check) — no data extracted from it.
#   * openemr_version_ref, image_version, build_date: derived from
#     the candidate image's OCI labels, which is:
#       * dependency-free (no operator input)
#       * a "candidate hasn't been tampered with post-build" smoke test
#         (the build already validated these labels; they should still
#         match if the tag hasn't been swapped)
#       * self-consistent — if reusable's OCI verify passes on the
#         final tags post-alias, it means the labels flowed through
#         imagetools-create cleanly.
#
# 48h age ceiling: same as acceptance-only.yml. A candidate older
# than 48h risks the rel-branch or the underlying build having moved
# on, and stale-candidate recovery isn't the workflow's use case.
#
# See docs/RELEASE_PROCESS.md's Phase 5 step 12 recovery paragraph
# and docs/artifact-acceptance-testing-plan.md's Phase 10c section
# for the design rationale.

name: Acceptance-only re-run + publish (docker)
run-name: "Docker acceptance-only re-run + publish for candidate ${{ inputs.candidate_tag }} (source run ${{ inputs.source_run_id }})"

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: 'Workflow run ID of the failed docker-build-release.yml run whose preserved candidate tag to re-verify (e.g. 12345678901). Must be a docker-build-release.yml run under 48h old. Used for the eligibility guardrails; no data extracted from it (source run''s dispatch inputs aren''t exposed via the runs API).'
        required: true
        type: string
      candidate_tag:
        description: 'Preserved candidate tag suffix on Docker Hub (e.g. release-candidate-30443247578-1). Visible on the failed docker-build-release.yml run''s build job outputs section.'
        required: true
        type: string
      docker_tags:
        description: 'Same comma-separated docker tags list the source run was dispatched with (e.g. "8.2.0,latest" or "next"). Copy from the source run''s dispatch inputs, visible on the failed run''s page under the workflow_dispatch details.'
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  # Serialize per-candidate so a fat-fingered double-click doesn't race
  # two identical publishes on the same final tags. Different candidates
  # still fan out in parallel.
  group: docker-acceptance-only-${{ inputs.candidate_tag }}
  cancel-in-progress: false

jobs:
  # Job 1: validate the source run + candidate tag, and derive the
  # 4 reusable inputs the publish path needs (candidate_tag comes
  # straight through, expanded_tags + 3 label-derived values are
  # looked up here).
  fetch-source-run-outputs:
    name: Fetch source run outputs
    # Only dispatchable from master. reusable-docker-publish.yml's
    # `uses:` resolves against this workflow's own ref, so a rel-
    # branch dispatch would run against the rel-branch's copy of the
    # reusable (which may not exist on older rel branches — see
    # byte-identical exclusion for rel-800/rel-704). Enforce master
    # here for symmetry with acceptance-only.yml.
    if: >-
      github.repository_owner == 'openemr' && github.repository == 'openemr/openemr'
      && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      candidate_tag: ${{ inputs.candidate_tag }}
      expanded_tags: ${{ steps.expand_docker_tags.outputs.list }}
      openemr_version_ref: ${{ steps.inspect_candidate.outputs.revision }}
      image_version: ${{ steps.inspect_candidate.outputs.version }}
      build_date: ${{ steps.inspect_candidate.outputs.created }}
    steps:
    # Guardrail A: source run must be a docker-build-release.yml run
    # under 48h old. Same shape acceptance-only.yml uses — see that
    # workflow's Validate step for the full rationale on each check.
    - name: Validate source run eligibility
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        REPO: ${{ github.repository }}
        SOURCE_RUN_ID: ${{ inputs.source_run_id }}
      run: |
        set -euo pipefail

        echo "==> Fetching source run metadata"
        run_json=$(gh api "repos/${REPO}/actions/runs/${SOURCE_RUN_ID}")

        source_path=$(printf '%s' "$run_json" | jq -er .path)
        source_created_at=$(printf '%s' "$run_json" | jq -er .created_at)

        echo "==> Confirming source run is a docker-build-release.yml run"
        expected_path=".github/workflows/docker-build-release.yml"
        if [ "$source_path" != "$expected_path" ]; then
          echo "::error::source run ${SOURCE_RUN_ID} was produced by '${source_path}', not '${expected_path}'."
          echo "::error::docker-acceptance-only only accepts source runs from docker-build-release.yml — the candidate_tag shape (release-candidate-<run-id>-<attempt>) is specific to that workflow."
          exit 1
        fi

        echo "==> Checking source run age (<= 48h)"
        source_epoch=$(date -d "$source_created_at" +%s)
        now_epoch=$(date -u +%s)
        age_seconds=$(( now_epoch - source_epoch ))
        age_hours=$(( age_seconds / 3600 ))
        ceiling_seconds=$(( 48 * 3600 ))

        if [ "$age_seconds" -gt "$ceiling_seconds" ]; then
          echo "::error::source run ${SOURCE_RUN_ID} is ${age_hours}h old (> 48h ceiling)."
          echo "::error::A preserved candidate this old risks not matching the rel-branch tip (some other PR may have landed). Recovery paths for stale runs: (1) dispatch docker-build-release.yml fresh (rebuilds the multi-arch image against current rel-branch tip); (2) re-run the failed docker-build-release run in-place via the Actions UI."
          exit 1
        fi

        echo "==> source run eligible: age=${age_hours}h, workflow=docker-build-release.yml"

    # Guardrail B: candidate tag must still exist on Docker Hub. If
    # cleanup-candidate somehow ran despite acceptance failure, or an
    # operator manually deleted the candidate before recovering, the
    # HEAD request here fails fast with a clear error — much better
    # than acceptance-docker.yml failing later with a confusing "image
    # pull failed" message deep in the matrix.
    #
    # Uses the anonymous Docker Hub v2 API tag endpoint: no login
    # needed for a HEAD-like existence check, and the response body
    # (small JSON with tag metadata) is fine to parse for a defense-
    # in-depth "tag actually is what we think" check.
    - name: Verify candidate tag exists on Docker Hub
      env:
        CANDIDATE_TAG: ${{ inputs.candidate_tag }}
      run: |
        set -euo pipefail

        url="https://hub.docker.com/v2/repositories/openemr/openemr/tags/${CANDIDATE_TAG}/"
        echo "==> HEAD ${url}"
        http_code=$(curl -s -o /tmp/dh-tag-response -w '%{http_code}' "$url")

        case "$http_code" in
          200)
            echo "==> Candidate tag openemr/openemr:${CANDIDATE_TAG} exists on Docker Hub."
            ;;
          404)
            echo "::error::Candidate tag openemr/openemr:${CANDIDATE_TAG} not found on Docker Hub (HTTP 404)."
            echo "::error::The candidate may have been already cleaned up (successful publish path deletes it) or manually deleted."
            echo "::error::Recovery paths: (1) if the source run's publish succeeded, no recovery needed; (2) if the source run failed BEFORE publish and the candidate is gone anyway, dispatch docker-build-release.yml fresh."
            exit 1
            ;;
          *)
            echo "::error::Unexpected HTTP ${http_code} from Docker Hub v2 API. Response:"
            cat /tmp/dh-tag-response || true
            exit 1
            ;;
        esac

    # Expand the operator-provided docker_tags list into the same
    # final-tag list docker-build-release.yml's build job would have
    # produced. Same expand-with-dated-variant logic — must stay in
    # sync with docker-build-release.yml's `expand_docker_tags` step.
    #
    # BUILD_DATE for dated-variant expansion comes from the candidate
    # image's org.opencontainers.image.created OCI label — this is
    # exactly the date the source run's build job stamped in, so the
    # dated-variant tags this recovery aliases match what the source
    # run would have produced.
    - name: Expand docker_tags list
      id: expand_docker_tags
      env:
        INPUT_TAGS: ${{ inputs.docker_tags }}
        CANDIDATE_TAG: ${{ inputs.candidate_tag }}
      run: |
        set -euo pipefail

        # Pull the candidate here so both this step and the label-inspect
        # step below can inspect it locally (docker inspect is a
        # metadata-only op post-pull).
        docker pull "openemr/openemr:${CANDIDATE_TAG}" > /dev/null
        BUILD_DATE=$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.created" }}' "openemr/openemr:${CANDIDATE_TAG}")
        if [ -z "$BUILD_DATE" ] || [ "$BUILD_DATE" = "<no value>" ]; then
          echo "::error::Candidate image openemr/openemr:${CANDIDATE_TAG} has no org.opencontainers.image.created label — cannot derive BUILD_DATE for dated-variant expansion."
          exit 1
        fi
        echo "    candidate BUILD_DATE (from OCI label)=${BUILD_DATE}"

        {
          echo 'list<<EOF'
          IFS=',' read -ra TAGS <<< "$INPUT_TAGS"
          for t in "${TAGS[@]}"; do
            t="${t// /}"   # strip whitespace
            [ -z "$t" ] && continue
            echo "openemr/openemr:${t}"
            # Rule: version-number tags (digits and dots only) also get
            # a dated sibling. Same logic as docker-build-release.yml's
            # `expand_docker_tags` step — must stay in sync.
            if [[ "$t" =~ ^[0-9]+(\.[0-9]+)+$ ]]; then
              echo "openemr/openemr:${t}-${BUILD_DATE}"
            fi
          done
          echo EOF
        } >> "$GITHUB_OUTPUT"

    # Inspect the candidate's OCI labels to derive the 3 values the
    # reusable's verify-oci-labels.sh step wants as EXPECTED_* env vars.
    # The candidate already passed OCI verify at build time (see docker-
    # build-release.yml's "Verify pushed candidate image OCI labels —
    # gated path" step), so these labels ARE what verify expects; this
    # is essentially a "labels haven't been tampered with since build"
    # smoke test rather than a fresh independent verification.
    #
    # Real independent-source verification would require pulling the
    # source run's workflow inputs and re-computing IMAGE_VERSION from
    # version.php at the openemr_version_ref — much more machinery for
    # a check that only defends against Docker Hub tag mutation, which
    # would fail loudly at pull time anyway.
    - name: Inspect candidate labels to derive publish inputs
      id: inspect_candidate
      env:
        CANDIDATE_TAG: ${{ inputs.candidate_tag }}
      run: |
        set -euo pipefail
        # Image was already pulled in the previous step; re-inspect is
        # cheap (local metadata).
        REVISION=$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "openemr/openemr:${CANDIDATE_TAG}")
        VERSION=$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' "openemr/openemr:${CANDIDATE_TAG}")
        CREATED=$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.created" }}' "openemr/openemr:${CANDIDATE_TAG}")

        for pair in "revision:${REVISION}" "version:${VERSION}" "created:${CREATED}"; do
          key="${pair%%:*}"
          value="${pair#*:}"
          if [ -z "$value" ] || [ "$value" = "<no value>" ]; then
            echo "::error::Candidate image is missing org.opencontainers.image.${key} label — cannot derive publish inputs."
            exit 1
          fi
        done

        {
          echo "revision=${REVISION}"
          echo "version=${VERSION}"
          echo "created=${CREATED}"
        } >> "$GITHUB_OUTPUT"
        echo "==> derived: revision=${REVISION} version=${VERSION} created=${CREATED}"

  # Job 2: mirrors docker-build-release.yml's acceptance-gate.
  # workflow_call into acceptance-docker.yml with to_tag pointed at
  # the candidate. Runs the full 3-scenario matrix on amd64 + arm64
  # (arm64 always-on in acceptance-docker.yml as of 2026-07-29).
  acceptance-gate:
    name: Acceptance gate
    needs: [fetch-source-run-outputs]
    uses: ./.github/workflows/acceptance-docker.yml
    with:
      to_tag: ${{ needs.fetch-source-run-outputs.outputs.candidate_tag }}
    secrets: inherit

  # Job 3: publish + cleanup via the shared reusable. Same reusable
  # docker-build-release.yml's gated path uses — single source of
  # truth for imagetools-alias + Docker Hub tag cleanup.
  publish-and-cleanup:
    name: Publish + cleanup
    needs: [fetch-source-run-outputs, acceptance-gate]
    uses: ./.github/workflows/reusable-docker-publish.yml
    with:
      candidate_tag: ${{ needs.fetch-source-run-outputs.outputs.candidate_tag }}
      expanded_tags: ${{ needs.fetch-source-run-outputs.outputs.expanded_tags }}
      openemr_version_ref: ${{ needs.fetch-source-run-outputs.outputs.openemr_version_ref }}
      image_version: ${{ needs.fetch-source-run-outputs.outputs.image_version }}
      build_date: ${{ needs.fetch-source-run-outputs.outputs.build_date }}
    secrets: inherit
