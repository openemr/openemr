name: Semgrep Security Scan

on:
  push:
    branches:
    - master
    - rel-*
  pull_request:
    branches:
    - master
    - rel-*
  schedule:
    # Run weekly on Monday at 9am UTC
  - cron: 0 9 * * 1
  workflow_dispatch:
  merge_group:

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && github.event.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  semgrep:
    name: Semgrep Security Scan
    runs-on: ubuntu-24.04
    container:
      image: semgrep/semgrep:latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Run Semgrep (full scan)
      if: github.event_name != 'pull_request' && github.event_name != 'merge_group'
      # Exclude the default echoed-request and printed-request rules from p/php
      # and use our custom versions in semgrep.yaml instead. Our custom rules add
      # OpenEMR's sanitization functions (attr, text, xlt, etc.) to prevent false
      # positives while still detecting real XSS vulnerabilities.
      # Exclude Documentation/ (generated SchemaSpy HTML, not application code)
      # and *.mustache (QRDA/CDA XML templates, not browser-rendered HTML).
      # JS/Node rulesets scan frontend scripts and ccdaservice.
      run: |
        semgrep \
          --config p/php \
          --config p/security-audit \
          --config p/javascript \
          --config p/nodejs \
          --config ./semgrep.yaml \
          --exclude vendor \
          --exclude node_modules \
          --exclude tests \
          --exclude ccdaservice/node_modules \
          --exclude Documentation \
          --exclude '*.mustache' \
          --exclude-rule php.lang.security.injection.echoed-request.echoed-request \
          --exclude-rule php.lang.security.injection.printed-request.printed-request \
          --sarif \
          --output=semgrep-results.sarif \
          .

    - name: Run Semgrep (diff only)
      if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
      env:
        # A merge group has no pull request; its payload carries the base SHA
        # directly. Diffing against it scans the combined changes of every
        # entry in the group against the target branch.
        BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
      # Exclude the default echoed-request and printed-request rules from p/php
      # and use our custom versions in semgrep.yaml instead. Our custom rules add
      # OpenEMR's sanitization functions (attr, text, xlt, etc.) to prevent false
      # positives while still detecting real XSS vulnerabilities.
      # Exclude Documentation/ (generated SchemaSpy HTML, not application code)
      # and *.mustache (QRDA/CDA XML templates, not browser-rendered HTML).
      # JS/Node rulesets scan frontend scripts and ccdaservice.
      run: |
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
        if [ -z "$BASE_SHA" ]; then
          printf '::error::BASE_SHA is empty for event %s; refusing to scan nothing\n' "$GITHUB_EVENT_NAME"
          exit 1
        fi
        semgrep \
          --config p/php \
          --config p/security-audit \
          --config p/javascript \
          --config p/nodejs \
          --config ./semgrep.yaml \
          --exclude vendor \
          --exclude node_modules \
          --exclude tests \
          --exclude ccdaservice/node_modules \
          --exclude Documentation \
          --exclude '*.mustache' \
          --exclude-rule php.lang.security.injection.echoed-request.echoed-request \
          --exclude-rule php.lang.security.injection.printed-request.printed-request \
          --baseline-commit="$BASE_SHA" \
          --sarif \
          --output=semgrep-results.sarif \
          .

    - name: Upload SARIF results
      uses: github/codeql-action/upload-sarif@v4
      if: always()
      with:
        sarif_file: semgrep-results.sarif

    - name: Upload results as artifact
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: semgrep-results
        path: semgrep-results.sarif
        retention-days: 30
