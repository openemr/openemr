name: oe-module-api-explorer drift check

# Compares the EXPLORER_SHA pinned in api-explorer-test.yml against upstream
# default-branch HEAD on sjpadgett/oe-module-api-explorer. When they diverge,
# a tracking issue is filed (deduped by title) with a compare link so a
# maintainer can review the diff and open a bump PR deliberately.

on:
  schedule:
  # Monday 12:00 UTC. Weekly cadence keeps the issue backlog small; drift
  # between the pin and upstream rarely moves fast enough to warrant daily.
  - cron: '0 12 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  drift:
    name: Compare pin against upstream main
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Compare pin against upstream HEAD
      id: compare
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail

        pin=$(grep -oE 'EXPLORER_SHA: [a-f0-9]{40}' .github/workflows/api-explorer-test.yml | awk '{print $2}')
        if [ -z "$pin" ]; then
            echo "::error::Could not read EXPLORER_SHA from api-explorer-test.yml"
            exit 1
        fi

        upstream=$(gh api repos/sjpadgett/oe-module-api-explorer/commits/main --jq '.sha')
        if [ -z "$upstream" ]; then
            echo "::error::Could not read upstream HEAD from sjpadgett/oe-module-api-explorer"
            exit 1
        fi

        echo "pin=${pin}"       >> "$GITHUB_OUTPUT"
        echo "upstream=${upstream}" >> "$GITHUB_OUTPUT"
        if [ "$pin" = "$upstream" ]; then
            echo "drift=false" >> "$GITHUB_OUTPUT"
        else
            echo "drift=true"  >> "$GITHUB_OUTPUT"
        fi

    - name: File tracking issue on drift
      if: steps.compare.outputs.drift == 'true'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        PIN: ${{ steps.compare.outputs.pin }}
        UPSTREAM: ${{ steps.compare.outputs.upstream }}
      run: |
        set -euo pipefail

        title="chore(ci): bump oe-module-api-explorer pin to ${UPSTREAM:0:12}"

        # Dedup: skip if an open issue with the same title exists already.
        existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "in:title \"${title}\"" --json number --jq '.[0].number // empty')
        if [ -n "$existing" ]; then
            echo "Open drift issue already exists: #${existing}"
            exit 0
        fi

        body=$(cat <<EOF
        The ci/api-explorer smoke pins sjpadgett/oe-module-api-explorer at a specific
        commit so a merge in that repo can't silently break OpenEMR CI. Weekly drift
        check noticed the pin is now behind upstream main:

        - Pin:      \`${PIN}\`
        - Upstream: \`${UPSTREAM}\`
        - Compare:  https://github.com/sjpadgett/oe-module-api-explorer/compare/${PIN}...${UPSTREAM}

        Review the compare link; if the diff looks safe, open a PR bumping \`EXPLORER_SHA\`
        in \`.github/workflows/api-explorer-test.yml\`.

        _Filed automatically by \`.github/workflows/api-explorer-drift-check.yml\`._
        EOF
        )

        gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
