##
# Weekly drift check for the openemr/oe-smart-questionnaire pin in
# ci/smart-launch/pin.sh. If upstream master has advanced beyond the
# pinned SHA, files an issue so a maintainer can decide whether to bump.
# (The smoke itself runs per-PR against the pin — this is just the
# "someone should look at this" nudge, not a pin bump.)

name: SMART Launch Pin Drift Check

on:
  schedule:
  - cron: '0 10 * * 1'  # Mondays 10:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    if: github.repository_owner == 'openemr' && github.repository == 'openemr/openemr'
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Compare pin against upstream master HEAD
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        # shellcheck source=../../ci/smart-launch/pin.sh
        . ci/smart-launch/pin.sh
        upstream_head=$(gh api repos/openemr/oe-smart-questionnaire/branches/master --jq .commit.sha)
        echo "Pinned:   ${SMART_QUESTIONNAIRE_PIN}"
        echo "Upstream: ${upstream_head}"
        if [[ "${SMART_QUESTIONNAIRE_PIN}" == "${upstream_head}" ]]; then
          echo "No drift."
          exit 0
        fi
        # Collect the commits between pin and upstream HEAD for the
        # issue body — gives the reviewer context without clicking out.
        drift_log=$(gh api \
          "repos/openemr/oe-smart-questionnaire/compare/${SMART_QUESTIONNAIRE_PIN}...${upstream_head}" \
          --jq '.commits | map("- " + .sha[0:7] + " " + (.commit.message | split("\n")[0])) | join("\n")')
        {
          echo "pin_short=${SMART_QUESTIONNAIRE_PIN:0:7}"
          echo "head_short=${upstream_head:0:7}"
          echo "head_full=${upstream_head}"
          echo 'drift_log<<EOF'
          echo "${drift_log}"
          echo 'EOF'
        } >> "$GITHUB_ENV"

    - name: File drift issue (idempotent per upstream SHA)
      if: ${{ env.head_full != '' }}
      env:
        GH_TOKEN: ${{ github.token }}
        PIN_SHORT: ${{ env.pin_short }}
        HEAD_SHORT: ${{ env.head_short }}
        HEAD_FULL: ${{ env.head_full }}
        DRIFT_LOG: ${{ env.drift_log }}
      run: |
        set -euo pipefail
        title="chore(ci): oe-smart-questionnaire pin drifted (${PIN_SHORT} → ${HEAD_SHORT})"
        # Idempotency: skip if an open issue with this exact title already
        # exists. A stale drift issue from a previous week auto-dedupes
        # because the title encodes the current upstream SHA; once the
        # pin moves forward, the next week's issue has a different
        # HEAD_SHORT and this filter won't match the old one.
        existing=$(gh issue list --repo "${GITHUB_REPOSITORY}" --state open --search "in:title \"${title}\"" --json number --jq '.[0].number')
        if [[ -n "${existing}" ]]; then
          echo "Open drift issue already exists (#${existing}); skipping."
          exit 0
        fi
        # Build the body with printf — avoids heredoc indent issues
        # that would otherwise require <<-EOF with tabs. Backticks
        # (markdown fences) survive printf fine.
        body=$(printf '%s\n' \
          "The SMART-launch smoke (\`ci/smart-launch/pin.sh\`) is pinned at:" \
          "" \
          '```' \
          "SMART_QUESTIONNAIRE_PIN=${PIN_SHORT}... (full in pin.sh)" \
          '```' \
          "" \
          "But upstream \`openemr/oe-smart-questionnaire\` \`master\` has advanced to:" \
          "" \
          '```' \
          "${HEAD_FULL}" \
          '```' \
          "" \
          "Commits since the pin:" \
          "" \
          "${DRIFT_LOG}" \
          "" \
          "If the drift looks safe, bump \`ci/smart-launch/pin.sh\` to the new SHA, verify the smoke still passes, and close this issue. If upstream changes break the smoke, that's useful signal — fix the smoke, then bump the pin." \
          "" \
          "This issue was filed automatically by \`.github/workflows/smart-launch-drift-check.yml\`.")
        gh issue create \
          --repo "${GITHUB_REPOSITORY}" \
          --title "${title}" \
          --body "${body}"
