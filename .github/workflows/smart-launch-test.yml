##
# SMART-launch smoke (openemr/openemr#14529).
#
# Boots ci/smart-launch/compose.yml (flex image + MariaDB + Selenium),
# stages upstream master of openemr/oe-smart-questionnaire into the
# openemr container, enables REST + FHIR globals, DCRs a client, and
# runs tests/Tests/SmartLaunch/SmartLaunchQuestionnaireTest.php, which
# drives the full standalone SMART launch via Panther. See
# ci/smart-launch/run.sh for the orchestrator and the issue body for
# the "why inferno-pattern rather than acceptance-side" rationale.
#
# Cadence: push + pull_request against master/rel-*. Not weekly cron —
# per-PR catches OAuth2/FHIR regressions at the author's PR, not days
# later. Also triggered when the SMART-launch surface itself changes
# (ci/smart-launch/**, tests/Tests/SmartLaunch/**, this workflow).
#
# No pin: the smoke always pulls upstream master. Trading off occasional
# transient red (an unrelated upstream merge breaking the smoke) against
# the maintenance tax of pin-bump review cycles.

name: SMART Launch Smoke

on:
  push:
    branches:
    - master
    - rel-*
  pull_request:
    branches:
    - master
    - rel-*
    # Deliberately no paths filter: the whole point of per-PR coverage
    # is catching OAuth2 / SMART / FHIR regressions in src/**, so a
    # narrow path filter would silently skip the exact PRs this smoke
    # exists to vet. Matches inferno-test.yml and the sibling
    # api-explorer-test.yml.

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && github.event.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  smart_launch_smoke:
    runs-on: ubuntu-24.04
    name: SMART Launch Smoke
    timeout-minutes: 30
    strategy:
      matrix:
        php-version: ['8.5']
        node-version: ['24']
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Fix permissions for Docker uid/gid differences
      run: |
        # HACK Docker runs with a different uid/gid than the host.
        # See openemr/openemr#9233 (same mitigation inferno-test.yml uses).
        sudo chmod -R 0777 .

    - name: Install PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php-version }}
        tools: composer:v2
        extensions: curl, dom, mbstring, tokenizer, xml, zip

    - name: Composer install
      run: composer install --prefer-dist --no-progress --no-interaction

    - name: Install Node
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}

    - name: npm ci + build (needed by install_configure)
      run: |
        npm ci
        npm run build

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Log Docker info
      run: |
        docker --version
        docker compose version

    - name: Login to Docker Hub
      # Authenticated pulls have a much higher rate limit than anonymous ones,
      # reducing the registry failures tracked in #12423. The secrets context
      # is unavailable in `if`, so map the secrets into env and gate on them;
      # fork PRs without the secrets skip this and pull anonymously as before.
      if: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
      env:
        DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Run SMART-launch smoke
      working-directory: ci/smart-launch
      shell: bash
      run: ./run.sh

    - name: Upload JUnit test results
      if: ${{ !cancelled() && hashFiles('junit-smart-launch.xml') != '' }}
      uses: actions/upload-artifact@v7
      with:
        name: junit-smart-launch
        path: junit-smart-launch.xml

    - name: Show Docker logs on failure
      if: ${{ !cancelled() && failure() }}
      working-directory: ci/smart-launch
      run: |
        docker compose -f compose.yml ps || true
        docker compose -f compose.yml logs openemr selenium || true
