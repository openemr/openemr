# Daily orchestrator for production docker image rebuilds.
#
# Reads .github/release-targets.yml as the source of truth for which
# branches to build, which docker tags to push, and which openemr source
# ref to bake in. Applies the include/exclude inputs to filter that list,
# then fans out one docker-build-release.yml dispatch per remaining row.
#
# Each fan-out call goes via `gh workflow run docker-build-release.yml
# --ref <branch> -f docker_tags=<...> -f openemr_version_ref=<...>` which
# dispatches that branch's own docker-build-release.yml against that
# branch's docker/release/Dockerfile -- per-branch isolation validated in
# the throwaway fork experiment described in
# openemr/openemr-devops#790.
#
# The docker-build-release.yml workflow:
#   * is byte-identical across master and every rel branch (it reads
#     docker_tags + openemr_version_ref purely from inputs)
#   * applies the version-number -> dated-sibling rule to docker_tags
#     (e.g. "8.1.0" gets a "8.1.0-YYYY-MM-DD" sibling pushed alongside)
#   * passes openemr_version_ref to docker build as OPENEMR_VERSION ARG
#
# Adding a rel branch: append a row to .github/release-targets.yml.
# Rotating `latest` between rel branches: edit one (or two) row(s)'s
# docker_tags in that same file. Promoting rel-810 to a v8_1_0 release:
# edit one row's openemr_version_ref from rel-810 to v8_1_0. None of
# these changes require editing this workflow file.

name: Docker release orchestrator

on:
  # Fire immediately when master's release-targets.yml changes (branch-cut,
  # patch-prep, release-finalize, or a manual edit). Prior to this trigger,
  # the daily 06:00 UTC tick was the only scheduled path, so a new/modified
  # row would sit unpublished for up to 24h. Push events treat inputs as
  # empty -> the fan-out matrix defaults to include=all (same as schedule).
  push:
    branches: [master]
    paths: [.github/release-targets.yml]
  schedule:
  - cron: '0 6 * * *'    # 06:00 UTC daily
  workflow_dispatch:
    inputs:
      include:
        description: 'Branches to build (comma-separated, or "all"). Examples: "all", "rel-810", "rel-810,master"'
        type: string
        default: 'all'
      exclude:
        description: 'Branches to skip (comma-separated). Useful with include=all.'
        type: string
        default: ''

# Serialize orchestrator runs so a burst of release-targets.yml pushes
# (or a schedule tick landing during a manual dispatch) doesn't fan out
# overlapping builds against the same rows. Single global group by
# workflow name because include/exclude inputs vary per invocation.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  compute-matrix:
    name: compute-matrix
    # Only run from master in the upstream repository -- this workflow lives
    # only on master (downstream forks shouldn't trigger production builds).
    if: github.repository_owner == 'openemr' && github.repository == 'openemr/openemr' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
    - name: Sparse checkout of release-targets.yml + queries lib
      uses: actions/checkout@v7
      with:
        # Also fetch the queries lib so the between-cycles tolerance
        # step below reads the same master_row_carries_next predicate
        # that drives detect-upgrade-cell-skip.sh's criterion 2 --
        # single-sourced signal across both consumers (see the lib
        # header for the full rationale).
        sparse-checkout: |
          .github/release-targets.yml
          .github/scripts/lib/release-targets-queries.sh

    - name: Build fan-out matrix from release-targets.yml
      id: gen
      env:
        INCLUDE: ${{ inputs.include || 'all' }}
        EXCLUDE: ${{ inputs.exclude || '' }}
        EVENT: ${{ github.event_name }}
      run: |
        # yq is pre-installed on github-hosted ubuntu runners.
        # Read the YAML data, filter by include/exclude inputs, emit JSON.
        # On `schedule` events the inputs are empty -- treat as include=all.
        FILTERED=$(yq -o=json -I=0 . .github/release-targets.yml | jq -c \
          --arg inc "$INCLUDE" --arg exc "$EXCLUDE" --arg ev "$EVENT" '
          [ .[] |
            . as $row |
            select(
              ($ev == "schedule") or
              ($inc == "all") or
              ($inc | split(",") | map(. == $row.branch) | any)
            ) |
            select(
              ($exc | split(",") | map(. == $row.branch) | any) | not
            ) |
            # Skip rows flagged unreleased — placeholder entries that
            # the validator still checks for ready-to-flip-live, but
            # consumers do not process. See .github/release-targets.yml
            # header for the multi-row-per-branch mechanism this enables.
            select(.unreleased != true)
          ]
        ')

        if [ "$FILTERED" = '[]' ] || [ -z "$FILTERED" ]; then
          echo "::error::No targets matched include='${INCLUDE}' exclude='${EXCLUDE}'." \
               "Nothing to dispatch."
          exit 1
        fi

        # Between-cycles tolerance: when master's row carries `next`
        # (post-finalize / pre-patch-prep window), the master-row
        # dispatch hits acceptance-docker's upgrade-cell with no
        # shippable version-version pairing to validate. The upgrade
        # cell will skip (criterion 2 in detect-upgrade-cell-skip.sh)
        # for the same correct reason that scheduled acceptance
        # dispatches skip tolerantly in this window; the fix is to
        # tell the dispatched docker-build-release.yml not to loud-
        # fail on that skip (require_upgrade_cell=false) rather than
        # inheriting the hardcoded release-mode default of true. Non-
        # master rows always keep true -- they publish real version-
        # tagged artifacts whose upgrade path IS shippable signal.
        #
        # Predicate is the shared master_row_carries_next() from
        # release-targets-queries.sh -- same source of truth as the
        # acceptance-side criterion 2, so false positives / negatives
        # propagate symmetrically. Negative-case regression wall lives
        # in tests/bats/ci-scripts/release-targets-queries/.
        set +e
        # shellcheck source=./.github/scripts/lib/release-targets-queries.sh
        source .github/scripts/lib/release-targets-queries.sh
        master_row_carries_next .github/release-targets.yml
        BETWEEN_CYCLES_RC=$?
        set -e
        case "${BETWEEN_CYCLES_RC}" in
          0) MASTER_BETWEEN_CYCLES=true ;;
          1) MASTER_BETWEEN_CYCLES=false ;;
          *)
            echo "::error::master_row_carries_next returned ${BETWEEN_CYCLES_RC} on .github/release-targets.yml -- cannot compute between-cycles tolerance safely. Failing dispatch rather than guessing." >&2
            exit 1
            ;;
        esac
        echo "master between-cycles (master row carries \`next\`): ${MASTER_BETWEEN_CYCLES}"

        # Enrich each row with require_upgrade_cell. Only master
        # downgrades (and only when the predicate fired); every other
        # row stays at true, matching docker-build-release.yml's
        # input default.
        ENRICHED=$(echo "$FILTERED" | jq -c \
          --argjson between "${MASTER_BETWEEN_CYCLES}" '
          map(
            . as $row |
            if $row.branch == "master" and $between == true then
              $row + {require_upgrade_cell: false}
            else
              $row + {require_upgrade_cell: true}
            end
          )
        ')

        echo "Resolved fan-out targets (enriched):"
        echo "$ENRICHED" | jq .

        echo "matrix={\"include\":$ENRICHED}" >> "$GITHUB_OUTPUT"

  fan-out:
    name: fan-out
    needs: compute-matrix
    runs-on: ubuntu-24.04
    # actions:write is the capability that `gh workflow run` needs to
    # dispatch docker-build-release.yml on each rel branch. Scoped to
    # this job only (compute-matrix doesn't need it).
    permissions:
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.compute-matrix.outputs.matrix) }}
    steps:
    - name: Dispatch ${{ matrix.branch }} (docker_tags=${{ matrix.docker_tags }} openemr_version_ref=${{ matrix.openemr_version_ref }})
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        BRANCH: ${{ matrix.branch }}
        DOCKER_TAGS: ${{ matrix.docker_tags }}
        OPENEMR_VERSION_REF: ${{ matrix.openemr_version_ref }}
        MATRIX_GATE_WITH_ACCEPTANCE: ${{ matrix.gate_with_acceptance }}
        MATRIX_REQUIRE_UPGRADE_CELL: ${{ matrix.require_upgrade_cell }}
      run: |
        # Phase 12: gate is driven by the per-row `gate_with_acceptance`
        # flag in release-targets.yml, defaulted false. Pre-Phase-12 we
        # auto-detected by "any tag == 'latest'" and only rel-820 (which
        # ships latest) got the gate; the CI-budget cost of QEMU-emulated
        # acceptance (~1h) made narrower scoping right. Phase 11's native
        # arm64 restructure dropped acceptance runtime to ~15-25 min, so
        # extending the gate to all rows that support the mechanism
        # (master + rel-820, and any future rel-830+) is affordable and
        # gives a consistent "was this validated before shipping?" bar.
        # rel-800 leaves the flag unset — it doesn't carry
        # acceptance-docker.yml (byte-identical exclusion) so the receiving
        # workflow wouldn't know how to run acceptance anyway; the docs
        # comment on the flag in release-targets.yml captures the rule.
        GATE="${MATRIX_GATE_WITH_ACCEPTANCE:-false}"

        # Only pass `-f gate_with_acceptance=...` when we actually want
        # the gate on (GATE=true). rel-800 carries the pre-
        # Phase-7c docker-build-release.yml (see the exclude-branches
        # for that path in .github/byte-identical.yml) which doesn't
        # declare a `gate_with_acceptance` input — GitHub Actions
        # rejects `gh workflow run -f <unknown>` with HTTP 422
        # "Unexpected inputs provided", failing dispatch entirely
        # before the target workflow even loads. Omitting the flag
        # lets the receiving workflow's input default (false) do the
        # right thing whether the input exists (master + rel-820) or
        # not (rel-800).
        GATE_ARGS=()
        if [[ "$GATE" == "true" ]]; then
          GATE_ARGS=(-f gate_with_acceptance=true)
        fi

        # Between-cycles tolerance pass-through (compute-matrix
        # resolved the per-row value from master_row_carries_next;
        # see that step's comments for the semantics). Follow the
        # same "only pass when non-default" shape as GATE_ARGS so
        # branches whose docker-build-release.yml predates the input
        # (rel-800, pre-sync rel-820/830) don't get rejected with
        # HTTP 422 "Unexpected inputs provided". The default on the
        # receiving side is true -- which matches today's hardcoded
        # release-mode behavior -- so omitting the arg on
        # require_upgrade_cell=true rows is correct for every branch
        # (both those that have the input and those that don't).
        # Only false requires an explicit pass, and false is only
        # ever emitted for master's row today.
        REQUIRE_UPGRADE_CELL_ARGS=()
        if [[ "${MATRIX_REQUIRE_UPGRADE_CELL}" == "false" ]]; then
          REQUIRE_UPGRADE_CELL_ARGS=(-f require_upgrade_cell=false)
        fi

        gh workflow run docker-build-release.yml \
          --repo "$REPO" \
          --ref "$BRANCH" \
          -f docker_tags="$DOCKER_TAGS" \
          -f openemr_version_ref="$OPENEMR_VERSION_REF" \
          "${GATE_ARGS[@]}" \
          "${REQUIRE_UPGRADE_CELL_ARGS[@]}"
        echo "Dispatched $BRANCH with docker_tags=$DOCKER_TAGS openemr_version_ref=$OPENEMR_VERSION_REF gate_with_acceptance=$GATE require_upgrade_cell=${MATRIX_REQUIRE_UPGRADE_CELL}"
