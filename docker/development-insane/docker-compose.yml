      OPENEMR_DOCKER_ENV_TAG: insane-dev-docker
      OPENEMR__ENVIRONMENT: "dev"
  dev-php-fpm-8-7-redis:
    restart: always
    image: openemr/dev-php-fpm:8.7@sha256:a1456c033910ad1e4c4fb115ce835100dca57ad7fcfcfcb5339a2d29db94106d
    volumes:
    - ../..:/usr/share/nginx/html/openemr
    - ../library/dockers/dev-php-fpm-8-7/php-ini/redis/php.ini:/usr/local/etc/php/php.ini:ro
    environment:
      OPENEMR_DOCKER_ENV_TAG: insane-dev-docker
      OPENEMR__ENVIRONMENT: "dev"
  redis:
    restart: always
    image: redis:8.12.0@sha256:56a1737794e36c3ebe8a4544a8ab421af3ab1a6488fb2238aec228c404933fed
  openldap:
    restart: always
    image: openemr/dev-ldap:insane@sha256:24b023a969e3a2e43bfab56e22474a036553c3d69687f8e0f9d8da968ed744a7
    environment:
      LDAP_TLS_VERIFY_CLIENT: try
      LDAP_TLS_CA_CRT_FILENAME: ca.pem
      LDAP_TLS_CRT_FILENAME: server-cert.pem
      LDAP_TLS_KEY_FILENAME: server-key.pem
  fhir:
    restart: always
    image: ibmcom/ibm-fhir-server:4.11.1@sha256:27f39ef992c4925407e20137b4103ab717d208b4a67c835b499ed46b67cccdf9
    ports:
    - 9443:9443
  selenium:
    restart: always
    image: selenium/standalone-chromium:156.0.8078.108@sha256:63b48b7cfab51ae3604bd11f83d62146961f707bebbce4f98ac542e0be29b645
    ports:
    - 4444:4444    # Selenium WebDriver interface
    - 7900:7900    # VNC port for viewing browser during tests (to work, will require SELENIUM_FORCE_HEADLESS to be "false" in openemr service)
    environment:
      SE_VNC_PASSWORD: openemr123
      SE_SCREEN_WIDTH: 1920
      SE_SCREEN_HEIGHT: 1080
      SE_SCREEN_DEPTH: 24
      SE_START_XVFB: true
    volumes:
    - /dev/shm:/dev/shm
    healthcheck:
      test: [CMD, curl, -f, http://localhost:4444/wd/hub/status]
      start_period: 30s
      interval: 30s
      timeout: 5s
      retries: 3
  mailpit:
    restart: unless-stopped
    image: axllent/mailpit:v1.34.0@sha256:23a2ef85bc50853ab3093645d1d64679afd8887e89da5e48a88940c172591a4e
    ports:
    - 8025:8025    # Web UI and API
    - 1025:1025    # SMTP server
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
      MP_MAX_MESSAGES: 5000
      MP_DATABASE: /data/mailpit.db
    volumes:
    - mailpitvolume:/data
    healthcheck:
      test: [CMD, wget, --quiet, --tries=1, --spider, http://localhost:8025/api/v1/messages]
      start_period: 10s
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  couchdbvolume: {}
  mailpitvolume: {}
