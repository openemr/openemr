    command: [mysqld, --character-set-server=utf8mb4]
    ports:
    - 8220:3306
    environment:
      MYSQL_ROOT_PASSWORD: root
    healthcheck:
      test:
      - CMD-SHELL
      - mysql -uroot -p$$MYSQL_ROOT_PASSWORD -e 'SELECT 1'
      start_period: 1m
      start_interval: 10s
      interval: 1m
      timeout: 5s
      retries: 3
  mysql-old:
    restart: always
    image: mysql:8.4.13@sha256:8c233bad33d520a7aae1c1e619c3a9775f4a1ba2d463d692fada04ec7f40be00
