#
# This is for building a local OpenEMR development and testing environment.
# (Recommend not running it from your git repo and instead mirroring your
#  git repo to a testing directory (such as your web directory).)
#
# Brief instructions on how to use (for fuller instructions and examples,
#  see the document at contrib/util/docker/README.md):
#   1. go to contrib/util/docker directory
#   2. docker compose up -d
#   3. Choose one of any of the following links:
#        http://localhost:8086 (with Alpine 3.23 (Apache and PHP 8.4))
#        http://localhost:8087 (with Alpine 3.23 (Apache and PHP 8.5))
#        http://localhost:8088 (with Alpine Edge (Apache and now PHP 8.5))
#        http://localhost:8096 (with Alpine 3.23 (Apache and PHP 8.4) with redis)
#        http://localhost:8097 (with Alpine 3.23 (Apache and PHP 8.5) with redis)
#        http://localhost:8098 (with Alpine Edge (Apache and now PHP 8.5) with redis)
#        http://localhost:8106 (with Nginx and PHP-FPM 8.4)
#        http://localhost:8107 (with Nginx and PHP-FPM 8.5)
#        http://localhost:8108 (with Nginx and PHP-FPM 8.6)
#        http://localhost:8109 (with Nginx and PHP-FPM 8.7)
#        http://localhost:8156 (with Nginx and PHP-FPM 8.4 with redis)
#        http://localhost:8157 (with Nginx and PHP-FPM 8.5 with redis)
#        http://localhost:8158 (with Nginx and PHP-FPM 8.6 with redis)
#        http://localhost:8159 (with Nginx and PHP-FPM 8.7 with redis)
#        https://localhost:9086 with SSL and Alpine 3.23 (with Apache and PHP 8.4)
#        https://localhost:9087 with SSL and Alpine 3.23 (with Apache and PHP 8.5)
#        https://localhost:9088 with SSL and Alpine Edge (with Apache and now PHP 8.5)
#        https://localhost:9096 with SSL and Alpine 3.23 (with Apache and PHP 8.4 with redis)
#        https://localhost:9097 with SSL and Alpine 3.23 (with Apache and PHP 8.5 with redis)
#        https://localhost:9098 with SSL and Alpine Edge (with Apache and now PHP 8.5 with redis)
#        https://localhost:9106 with SSL (with Nginx and PHP-FPM 8.4)
#        https://localhost:9107 with SSL (with Nginx and PHP-FPM 8.5)
#        https://localhost:9108 with SSL (with Nginx and PHP-FPM 8.6)
#        https://localhost:9109 with SSL (with Nginx and PHP-FPM 8.7)
#        https://localhost:9156 with SSL (with Nginx and PHP-FPM 8.4 with redis)
#        https://localhost:9157 with SSL (with Nginx and PHP-FPM 8.5 with redis)
#        https://localhost:9158 with SSL (with Nginx and PHP-FPM 8.6 with redis)
#        https://localhost:9159 with SSL (with Nginx and PHP-FPM 8.7 with redis)

#
#    On the main setup input screen:
#     1. for Server Host, use either 'mariadb' or `mariadb-ssl` or 'mysql' or 'mysql-old' or 'mariadb-old' or 'mariadb-very-old' or 'mariadb-very-very-old' (have both mariadb/mysql dockers ready to go make testing either one easy; mysql is version 9.7; mysql-old is version 8.4; mariadb is version 12.3; mariadb-ssl is version 12.3 with support for ssl; mariadb-old is version 11.8; mariadb-very-old is version 11.4; mariadb-very-very-old is version 10.11)
#     2. for Root Pass, use 'root'
#     3. for User Hostname, use '%'
#    And when need to tear it down and restart it
#     1. docker compose down -v
#     2. docker compose up -d
#    Can see databases via http://localhost:8200
#
services:
  openemr-8-4:
    restart: always
    image: openemr/openemr:flex-3.24-php-8.4@sha256:f6a5dfda70e0cdb0965b6e1cc774bc9c9562b05b8e09d6158ad9d5dff414817d
    ports:
    - 8086:80
    - 9086:443
    volumes:
    - ../..:/var/www/localhost/htdocs/openemr
    environment:
      HOST_UID: "${HOST_UID:-1000}"
      HOST_GID: "${HOST_GID:-1000}"
      DEBUG_COLORS: 'true'
      TERM: xterm-256color
      COLORTERM: truecolor
      OPENEMR_DOCKER_ENV_TAG: insane-dev-docker
      OPENEMR__ENVIRONMENT: "dev"
      FORCE_NO_BUILD_MODE: yes
      EMPTY: yes
    healthcheck:
      test:
      - CMD
      - /usr/bin/curl
      - --fail
      - --insecure
      - --location
      - --show-error
      - --silent
      - https://localhost/meta/health/readyz
      interval: 1m
      retries: 3
      start_interval: 10s
      start_period: 3m
      timeout: 5s
  openemr-8-5:
    restart: always
    image: openemr/openemr:flex-3.24-php-8.5@sha256:a28c41ed3216466c4a661d68ec8ea429f4fcaddde827df75d324066be944226a
    ports:
    - 8087:80
    - 9087:443
    volumes:
    - ../..:/var/www/localhost/htdocs/openemr
    - couchdbvolume:/couchdb/data
    environment:
      HOST_UID: "${HOST_UID:-1000}"
      HOST_GID: "${HOST_GID:-1000}"
      DEBUG_COLORS: 'true'
      TERM: xterm-256color
      COLORTERM: truecolor
      OPENEMR_DOCKER_ENV_TAG: insane-dev-docker
      OPENEMR__ENVIRONMENT: "dev"
      EMPTY: yes
      MYSQL_HOST: mariadb
      MYSQL_ROOT_PASS: root
      DEVELOPER_TOOLS: yes
      INSANE_DEV_MODE: yes
      XDEBUG_ON: 1
      XDEBUG_PROFILER_ON: 1
      # setting xdebug client host for cases where xdebug.discover_client_host fails
      XDEBUG_CLIENT_HOST: host.docker.internal
      GITHUB_COMPOSER_TOKEN: c313de1ed5a00eb6ff9309559ec9ad01fcc553f0
      GITHUB_COMPOSER_TOKEN_ENCODED: Z2hwX0NpbnJ4aXlNd0NzcGZXWG1UWFUwcXhGa040elFKSDJoZGJXVw==
      GITHUB_COMPOSER_TOKEN_ENCODED_ALTERNATE: 103 104 112 95 57 54 108 115 88 116 87 72 51 75 81 105 69 88 88 119 97 79 80 78 109 69 66 115 85 97 106 78 112 71 49 81 90 102 74 121
      SELENIUM_USE_GRID: 'true'
      SELENIUM_HOST: selenium
      SELENIUM_FORCE_HEADLESS: 'false'
      SELENIUM_BASE_URL: http://openemr-8-5    # NOTE THIS NEEDS TO BE MODIFIED WHEN SERVICE NAME CHANGES!
      OPENEMR_SETTING_site_addr_oath: https://localhost:9087 # NOTE THIS NEEDS TO BE MODIFIED WHEN ABOVE SERVICE PORT CHANGES!
      OPENEMR_SETTING_oauth_password_grant: 3
      OPENEMR_SETTING_rest_system_scopes_api: 1
      OPENEMR_SETTING_rest_api: 1
      OPENEMR_SETTING_rest_fhir_api: 1
      OPENEMR_SETTING_rest_portal_api: 1
      OPENEMR_SETTING_portal_onsite_two_enable: 1
      OPENEMR_SETTING_ccda_alt_service_enable: 3
      OPENEMR_SETTING_couchdb_host: couchdb
      OPENEMR_SETTING_couchdb_port: 6984
      OPENEMR_SETTING_couchdb_user: admin
      OPENEMR_SETTING_couchdb_pass: password
      OPENEMR_SETTING_couchdb_dbase: example
      OPENEMR_SETTING_couchdb_ssl_allow_selfsigned: 1
      OPENEMR_SETTING_gbl_ldap_host: ldap://openldap:389
      OPENEMR_SETTING_gbl_ldap_dn: cn={login},dc=example,dc=org
      OPENEMR_SETTING_EMAIL_METHOD: SMTP
      OPENEMR_SETTING_SMTP_HOST: mailpit
      OPENEMR_SETTING_SMTP_PORT: 1025
      OPENEMR_SETTING_SMTP_USER: openemr
      OPENEMR_SETTING_SMTP_PASS: openemr
      OPENEMR_SETTING_SMTP_SECURE: ''
      OPENEMR_SETTING_SMTP_Auth: 'TRUE'
      OPENEMR_SETTING_practice_return_email_path: noreply@openemr.local
      OPENEMR_SETTING_Patient_Reminder_Sender_Name: OpenEMR Reminders
    healthcheck:
      test:
      - CMD
      - /usr/bin/curl
      - --fail
      - --insecure
      - --location
      - --show-error
      - --silent
      - https://localhost/meta/health/readyz
      interval: 1m
      retries: 3
      start_interval: 10s
      start_period: 3m
      timeout: 5s
  openemr-edge:
    restart: always
    image: openemr/openemr:flex-edge@sha256:592a092e89ae382524dabfff653f5ea6ae347ffb12df2bee7bfd76da25e1dbca
    ports:
    - 8088:80
    - 9088:443
    volumes:
    - ../..:/var/www/localhost/htdocs/openemr
    environment:
      HOST_UID: "${HOST_UID:-1000}"
      HOST_GID: "${HOST_GID:-1000}"
      DEBUG_COLORS: 'true'
      TERM: xterm-256color
      COLORTERM: truecolor
      OPENEMR_DOCKER_ENV_TAG: insane-dev-docker
      OPENEMR__ENVIRONMENT: "dev"
      FORCE_NO_BUILD_MODE: yes
      EMPTY: yes
    healthcheck:
      test:
      - CMD
      - /usr/bin/curl
      - --fail
      - --insecure
      - --location
      - --show-error
      - --silent
      - https://localhost/meta/health/readyz
      interval: 1m
      retries: 3
      start_interval: 10s
      start_period: 3m
      timeout: 5s
  openemr-8-4-redis:
    restart: always
    image: openemr/openemr:flex-3.24-php-8.4@sha256:f6a5dfda70e0cdb0965b6e1cc774bc9c9562b05b8e09d6158ad9d5dff414817d
    ports:
    - 8096:80
    - 9096:443
    volumes:
    - ../..:/var/www/localhost/htdocs/openemr
    environment:
      HOST_UID: "${HOST_UID:-1000}"
