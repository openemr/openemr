      interval: 1m
      retries: 3
      start_interval: 10s
      start_period: 3m
      timeout: 5s
  mariadb:
    restart: always
    image: mariadb:12.3.3@sha256:4aaf88b3106382c8c18e49f0cec60267be618fc22f858c4503afb2a2555afed3
    command: [mariadbd, --character-set-server=utf8mb4]
    ports:
    - 8210:3306
    environment:
      MYSQL_ROOT_PASSWORD: root
    healthcheck:
      test:
      - CMD
      - /usr/local/bin/healthcheck.sh
      - --su-mysql
      - --connect
      - --innodb_initialized
      start_period: 1m
      start_interval: 10s
      interval: 1m
      timeout: 5s
      retries: 3
  mariadb-ssl:
