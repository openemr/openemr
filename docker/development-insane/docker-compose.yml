#
# This is for building a local OpenEMR development and testing environment.
# (Recommend not running it from your git repo and instead mirroring your
#  git repo to a testing directory (such as your web directory).)
#
# Brief instructions on how to use (for fuller instructions and examples,
#  see the document at contrib/util/docker/README.md):
#   1. go to contrib/util/docker directory
#   2. docker compose up -d
#   3. Choose one of any of the following links:
#        http://localhost:8084 (with Alpine 3.22 (Apache and PHP 8.2))
#        http://localhost:8085 (with Alpine 3.23 (Apache and PHP 8.3))
#        http://localhost:8086 (with Alpine 3.23 (Apache and PHP 8.4))
#        http://localhost:8087 (with Alpine 3.23 (Apache and PHP 8.5))
#        http://localhost:8088 (with Alpine Edge (Apache and now PHP 8.5))
#        http://localhost:8094 (with Alpine 3.22 (Apache and PHP 8.2) with redis)
#        http://localhost:8095 (with Alpine 3.23 (Apache and PHP 8.3) with redis)
#        http://localhost:8096 (with Alpine 3.23 (Apache and PHP 8.4) with redis)
#        http://localhost:8097 (with Alpine 3.23 (Apache and PHP 8.5) with redis)
#        http://localhost:8098 (with Alpine Edge (Apache and now PHP 8.5) with redis)
#        http://localhost:8104 (with Nginx and PHP-FPM 8.2)
#        http://localhost:8105 (with Nginx and PHP-FPM 8.3)
#        http://localhost:8106 (with Nginx and PHP-FPM 8.4)
#        http://localhost:8107 (with Nginx and PHP-FPM 8.5)
#        http://localhost:8108 (with Nginx and PHP-FPM 8.6)
#        http://localhost:8154 (with Nginx and PHP-FPM 8.2 with redis)
#        http://localhost:8155 (with Nginx and PHP-FPM 8.3 with redis)
#        http://localhost:8156 (with Nginx and PHP-FPM 8.4 with redis)
#        http://localhost:8157 (with Nginx and PHP-FPM 8.5 with redis)
#        http://localhost:8158 (with Nginx and PHP-FPM 8.6 with redis)
#        https://localhost:9084 with SSL and Alpine 3.22 (with Apache and PHP 8.2)
#        https://localhost:9085 with SSL and Alpine 3.23 (with Apache and PHP 8.3)
#        https://localhost:9086 with SSL and Alpine 3.23 (with Apache and PHP 8.4)
#        https://localhost:9087 with SSL and Alpine 3.23 (with Apache and PHP 8.5)
#        https://localhost:9088 with SSL and Alpine Edge (with Apache and now PHP 8.5)
#        https://localhost:9094 with SSL and Alpine 3.22 (with Apache and PHP 8.2 with redis)
#        https://localhost:9095 with SSL and Alpine 3.23 (with Apache and PHP 8.3 with redis)
#        https://localhost:9096 with SSL and Alpine 3.23 (with Apache and PHP 8.4 with redis)
#        https://localhost:9097 with SSL and Alpine 3.23 (with Apache and PHP 8.5 with redis)
#        https://localhost:9098 with SSL and Alpine Edge (with Apache and now PHP 8.5 with redis)
#        https://localhost:9104 with SSL (with Nginx and PHP-FPM 8.2)
#        https://localhost:9105 with SSL (with Nginx and PHP-FPM 8.3)
#        https://localhost:9106 with SSL (with Nginx and PHP-FPM 8.4)
#        https://localhost:9107 with SSL (with Nginx and PHP-FPM 8.5)
#        https://localhost:9108 with SSL (with Nginx and PHP-FPM 8.6)
#        https://localhost:9154 with SSL (with Nginx and PHP-FPM 8.2 with redis)
#        https://localhost:9155 with SSL (with Nginx and PHP-FPM 8.3 with redis)
#        https://localhost:9156 with SSL (with Nginx and PHP-FPM 8.4 with redis)
#        https://localhost:9157 with SSL (with Nginx and PHP-FPM 8.5 with redis)
#        https://localhost:9158 with SSL (with Nginx and PHP-FPM 8.6 with redis)

#
#    On the main setup input screen:
#     1. for Server Host, use either 'mariadb' or `mariadb-ssl` or 'mysql' or 'mysql-old' or 'mariadb-old' or 'mariadb-very-old' or 'mariadb-very-very-old' (have both mariadb/mysql dockers ready to go make testing either one easy; mysql is version 9.7; mysql-old is version 8.4; mariadb is version 12.3; mariadb-ssl is version 12.3 with support for ssl; mariadb-old is version 11.8; mariadb-very-old is version 11.4; mariadb-very-very-old is version 10.11)
#     2. for Root Pass, use 'root'
#     3. for User Hostname, use '%'
#    And when need to tear it down and restart it
#     1. docker compose down -v
#     2. docker compose up -d
#    Can see databases via http://localhost:8200
#
services:
  openemr-8-2:
    restart: always
    image: openemr/openemr:flex-3.22-php-8.2@sha256:ae4d1b9373b3588011f8f955116529f5ef551509e028612af7a777cd081548f5
    ports:
    - 8084:80
    - 9084:443
    volumes:
    - ../..:/var/www/localhost/htdocs/openemr
    environment:
      HOST_UID: "${HOST_UID:-1000}"
      HOST_GID: "${HOST_GID:-1000}"
      DEBUG_COLORS: 'true'
      TERM: xterm-256color
      COLORTERM: truecolor
      OPENEMR_DOCKER_ENV_TAG: insane-dev-docker
      FORCE_NO_BUILD_MODE: yes
      EMPTY: yes
    healthcheck:
      test:
      - CMD
      - /usr/bin/curl
      - --fail
      - --insecure
      - --location
      - --show-error
      - --silent
      - https://localhost/meta/health/readyz
      interval: 1m
      retries: 3
      start_interval: 10s
      start_period: 3m
      timeout: 5s
