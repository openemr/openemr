<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />

<title>Portal | Activity</title>

<meta name="description" content="OpenEMR Portal" />
<meta name="author" content="Form | sjpadgett@gmail.com" />

<!-- Styles -->

<!-- setupHeader stub -->

<script>window.portalApiCsrfToken = "test-csrf-token";</script>
<script src="/openemr/portal/patient/scripts/portal-page.js?v=82"></script>
<script src="/openemr/portal/patient/scripts/portal-api.js?v=82"></script>
<script src="/openemr/portal/portal_payment.js?v=82"></script>

</head>
<body>
<script>var cuser="admin";</script>
<script>
    let csrfToken = "test-csrf-token";
</script>
<script src="/openemr/portal/patient/scripts/app/onsiteactivityviews.js?v=82"></script>
<script>
    $(function () {
        actpage.init();
    });
</script>

<div class="container mt-5">

<h3>
    <i class="icon-th-list"></i>Onsite Patient Activities
    <span id="loader" class="loader progress progress-striped active"><span class="progress-bar"></span></span>
    <div class="col-sm-3 col-md-3 float-right">
        <form class="navbar-form" role="search">
        <div class="input-group">
            <input type="text" class="form-control" placeholder="Search" name="srch-term" id="srch-term" />
            <div class="input-group-append">
                <button class="btn btn-secondary" type="submit"><i class="fas fa-search"></i></button>
            </div>
        </div>
        </form>
    </div>
</h3>
    <!-- the review list; onsiteactivityviews.js adds a row per activity -->
    <template id="onsiteActivityViewCollectionTemplate">
        <table class="collection table table-sm table-bordered table-hover">
        <thead>
            <tr>
                <th id="header_Id">Id</th>
                <th id="header_Date">Date</th>
                <th id="header_PatientId">Patient Id</th>
                <th id="header_Fname">First</th>
                <th id="header_Mname">Middle</th>
                <th id="header_Lname">Last</th>
                <th id="header_Narrative">Narrative</th>
                <th id="header_Activity">Activity</th>
                <th id="header_TableArgs">Amount</th>
                <th id="header_PendingAction">Pending Action</th>
                <th id="header_Status">Status</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody>
        </tbody>
        </table>
    </template>
    <template id="onsiteActivityViewRowTemplate">
        <tr>
            <td data-field="id"></td>
            <td data-field="date"></td>
            <td data-field="patientId"></td>
            <td data-field="fname"></td>
            <td data-field="mname"></td>
            <td data-field="lname"></td>
            <td data-field="narrative"></td>
            <td data-field="activity"></td>
            <td data-field="amount"></td>
            <td data-field="pendingAction"></td>
            <td data-field="status"></td>
            <td><button class="delete-button btn btn-sm btn-link"><i class="fa fa-trash text-danger"></i></button></td>
        </tr>
    </template>
    <div id="collectionAlert"></div>
    <div id="onsiteActivityViewCollectionContainer" class="collectionContainer"></div>
    <p id="returnButtonContainer" class="buttonContainer">
        <button id="returnHome" class="btn btn-primary">Home</button>
    </p>
</div> <!-- /container -->
<!-- footer -->
<div class="container">
    <hr id="footer-hr" />
    <footer>
        <p class="muted text-sm-center">
            <small>Patient Portal v8.1.0 Copyright &copy; 2026 By
                sjpadgett@gmail.com License GPLv3
            </small>
        </p>
    </footer>
</div>
</body>
</html>
