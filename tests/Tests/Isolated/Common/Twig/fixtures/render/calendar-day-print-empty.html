<!DOCTYPE html>
<html>
<head>
    <style>
        a { text-decoration: none; }
        td { font-family: Arial, Helvetica, sans-serif; }
        div.tiny { width: 1px; height: 1px; font-size: 1px; }
        #bigCalHeader { height: 20%; font-family: Arial, Helvetica, sans-serif; }
        #bigCalText { float: left; }
        #provname { font-size: 2em; }
        #daterange { font-size: 1.8em; font-weight: bold; }
        #bigCal { height: 80%; }
        #bigCal table { border-collapse: collapse; }
        #datePicker { float: right; display: inline; padding: 5px; text-align: center; background-color: lightblue; }
        #datePicker td { font-family: Arial, Helvetica, sans-serif; font-size: 0.7em; }
        #datePicker table { border-collapse: collapse; }
        #datePicker .tdDOW-small, #datePicker .tdWeekend-small, #datePicker .tdOtherMonthDay-small, #datePicker .tdMonthDay-small {
            font-family: Arial, Helvetica, sans-serif; font-size: 10px; vertical-align: top; padding: 2px 3px 2px 3px;
        }
        #datePicker .tdDOW-small { background-color: lightblue; text-align: center; border: none; }
        #datePicker .tdDatePicker { cursor: pointer; }
        #datePicker .tdWeekend-small { background-color: #dddddd; color: #999999; border: none; }
        #datePicker .tdOtherMonthDay-small { background-color: #ffffff; color: #999999; border: none; }
        #datePicker .tdMonthName-small { text-align: center; font-family: Arial, Helvetica, sans-serif; font-size: 12px; }
        #datePicker .tdMonthDay-small { background-color: #ffffff; border: none; }
        #datePicker .currentDate { border: 1px solid blue; background-color: blue; color: lightblue; }
        #times,
        .calendar-times-col {
            border-right: 1px solid #999;
            box-sizing: border-box;
            max-width: 3.25rem !important;
            min-width: 3.25rem !important;
            overflow: hidden;
            vertical-align: top;
            width: 3.25rem !important;
        }
        #times table,
        .calendar-times-table {
            border-collapse: collapse;
            margin: 0;
            padding: 0;
            table-layout: fixed;
            width: 100%;
        }
        #times table td,
        .calendar-times-table td {
            border: 0;
            border-top: 1px solid #999;
            font-size: 10pt;
            margin: 0;
            overflow: hidden;
            padding: 0;
            text-overflow: clip;
            white-space: nowrap;
        }
        .calendar-times-inner {
            box-sizing: border-box;
            max-width: 100%;
            overflow: hidden;
            width: 100%;
        }
        .timeslot { height: 20px; margin: 0; padding: 0; }
        .schedule { background-color: pink; vertical-align: top; padding: 0; margin: 0; border-right: 1px solid black; }
        .event_in       { position: absolute; background-color: white;     width: 100%; font-size: 0.8em; color: #ddd; border-top: 1px dashed #ddd; }
        .event_out      { position: absolute; background-color: lightgray; width: 100%; font-size: 0.8em; color: #ddd; border-top: 1px dashed #ddd; }
        .event_appointment { position: absolute; background-color: white; overflow: hidden; border: 1px solid blue; width: 100%; font-size: 0.8em; }
        .event_noshow      { position: absolute; background-color: pink;  overflow: hidden; border: 1px solid blue; width: 100%; font-size: 0.8em; }
        .event_visit_list { background-color: #fff; border: 1px solid #000; font-size: 0.8em; }
.visit-list-header { border-bottom: 1px solid #999; padding: 0 2px; }
.visit-list-title { font-weight: bold; }
.visit-list-entries { list-style: none; margin: 0; padding: 0 2px; }
.visit-list-entry { white-space: nowrap; }
.visit-list-sequence { display: inline-block; font-weight: bold; min-width: 1.75em; }
.visit-list-category { font-style: italic; }
        #bigCal .event_visit_list:not(.visit-list-full) { position: absolute; width: 100%; overflow: hidden; z-index: 1; }
        .visit-list-overflow { display: none; }
        .visit-list-more { font-style: italic; }
        .visit-list-continued { font-family: Arial, Helvetica, sans-serif; }
        .visit-list-full { break-inside: avoid; margin-top: 0.5em; }
        .visit-list-provider { font-weight: bold; padding: 0 2px; }
        .event_reserved    { position: absolute; background-color: pink;  overflow: hidden; border: 1px solid blue; width: 100%; font-size: 0.8em; }
    </style>
    <!-- setupHeader stub -->
</head>
<body>

<script>
    function pcFitVisitList(block, marker, label) {
        var list = block.querySelector('.visit-list-entries');
        if (list === null || block.scrollHeight <= block.clientHeight) {
            return 0;
        }
        var rows = list.querySelectorAll('.visit-list-entry');
        var labelElement = marker.querySelector('.visit-list-more-label');
        var hidden = 0;
        list.appendChild(marker);
        labelElement.textContent = label(hidden);
        for (var i = rows.length - 1; i >= 0 && block.scrollHeight > block.clientHeight; i--) {
            rows[i].classList.add('visit-list-overflow');
            hidden++;
            labelElement.textContent = label(hidden);
        }
        var header = block.querySelector('.visit-list-header');
        if (block.scrollHeight > block.clientHeight && header !== null) {
            var content = marker.firstElementChild;
            content.classList.add('visit-list-more-in-header');
            header.insertBefore(content, header.querySelector('.visit-list-add'));
            marker.remove();
        }
        block.classList.add('visit-list-fitted');
        return hidden;
    }
</script>
<script>
    (function () {
        var continuedText = "Continued below the schedule";
        var shown = 0;
        document.querySelectorAll('#bigCal .event_visit_list:not(.visit-list-full)').forEach(function (block) {
            var marker = document.createElement('li');
            marker.className = 'visit-list-more';
            marker.innerHTML = '<span class="visit-list-more-label"></span>';
            var hidden = pcFitVisitList(block, marker, function (count) {
                return '+' + count + ' · ' + continuedText;
            });
            var full = document.querySelector('.visit-list-full[data-eid="' + block.dataset.eid + '"]');
            if (full === null) {
                return;
            }
            if (hidden === 0) {
                full.remove();
            } else {
                shown++;
            }
        });
        if (shown === 0) {
            document.querySelector('.visit-list-continued').remove();
        }
    })();
</script>

</html>
