<!DOCTYPE html>
<html>
<head>
    <title>Questionnaire Preview</title>
    <!-- setupHeader stub -->
    <link href="/q.css" media="screen" rel="stylesheet" />
<script src="/q.js" data-openemr-version="8.5.0" data-openemr-strings="{}"></script>
</head>
<body class="body_top">
<div class="container-fluid">
    <div class="d-flex justify-content-between align-items-center mt-3 mb-2">
        <h2 class="h4 mb-0">PHQ-9</h2>
        <div class="btn-group btn-group-sm">
            <button type="button" id="view-response" class="btn btn-outline-primary">View Response</button>
            <a class="btn btn-secondary" href="manage_questionnaire_availability.php" onclick="top.restoreSession()">Back</a>
        </div>
    </div>
            <div id="form-container"></div>
        <pre id="response" class="d-none border p-2 mt-3 small"></pre>
        <script>
            (function () {
                const runtime = OpenEMRQuestionnaire.mount({
                    questionnaire: JSON.parse("{\"resourceType\":\"Questionnaire\"}"),
                    container: document.getElementById('form-container'),
                    options: { questionLayout: 'vertical' }
                })
                document.getElementById('view-response').addEventListener('click', () => {
                    const output = document.getElementById('response')
                    output.textContent = JSON.stringify(runtime.getQuestionnaireResponse(), null, 2)
                    output.classList.remove('d-none')
                })
            })()
        </script>
    </div>
</body>
</html>
