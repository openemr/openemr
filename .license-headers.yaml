# License header policy, enforced by `php bin/console --skip-globals openemr:license-headers`.
#
# Every PHP, JS, CSS, SCSS, and Twig file needs a @license tag in its header.
# The standard value is allowed everywhere. Each entry under `licenses` allows
# another value, but only under its paths. Files under `exempt` are not checked
# at all: use it for third-party and generated code, so the check never asks
# anyone to put a GPL tag on code the project does not own.
#
# Paths are fnmatch() patterns relative to the project root, and `*` also
# matches `/`, so `gacl/*` covers everything below gacl/. Every entry needs a
# reason.

standard: https://github.com/openemr/openemr/blob/master/LICENSE GNU General Public License 3

licenses:
- value: http://www.gnu.org/copyleft/lesser.html LGPL
  reason: Phreeze framework and the portal code generated from it.
  paths:
  - portal/patient/*
- value: http://www.gnu.org/licenses/lgpl.html LGPL
  reason: Phreeze framework and the portal code generated from it.
  paths:
  - portal/patient/*
- value: https://www.gnu.org/licenses/old-licenses/lgpl-2.1.html GNU Lesser General Public License 2.1
  reason: Port of phpGACL, which is LGPL 2.1.
  paths:
  - src/Gacl/*
- value: http://www.gnu.org/licenses/licenses.html#GPL GNU GPL V3+
  reason: Files that grant GPL version 3 or later.
  paths:
  - library/checkout_receipt_array.inc.php
  - library/validation/*
- value: https://www.gnu.org/licenses/licenses.html#GPL GNU GPL V3+
  reason: Files that grant GPL version 3 or later.
  paths:
  - interface/webhooks/payment/rainforest.php
  - library/FeeSheet.class.php
- value: http://opensource.org/licenses/gpl-license.php GNU Public License
  reason: Theme file that names the GPL without a version.
  paths:
  - interface/themes/color_base.scss
# The values below mark AI-generated segments as public domain. Each file also
# carries the standard GPL tag for the rest of its code.
- value: There are segments of code in this file that have been generated via ChatGPT and are licensed as Public Domain, they are marked with a header and footer.
  reason: Marks AI-generated segments as public domain.
  paths:
  - templates/super/rules/controllers/*
- value: There are segments of code in this file that have been generated via ChatGPT and are licensed as Public Domain. They have been marked with a header and footer.
  reason: Marks AI-generated segments as public domain.
  paths:
  - library/js/limitedcustom_config.js
- value: There are segments of code in this file that have been generated via Claude.ai and are licensed as Public Domain. They have been marked with a header and footer.
  reason: Marks AI-generated segments as public domain.
  paths:
  - interface/forms/newpatient/C_EncounterVisitForm.class.php
  - interface/forms/newpatient/common.php
  - library/js/limitedcustom_config.js
  - src/Common/Forms/FormLocator.php
- value: There are segments of code in this file that have been generated via Claude.ai and used common.php as its original source are licensed as Public Domain. They have been marked with a header and footer.
  reason: Marks AI-generated segments as public domain.
  paths:
  - interface/forms/newpatient/newpatient.js
- value: This code was generated as a translation of code in the newpatient/common.php file via Claude.ai and are licensed as Public Domain. They have been marked with a header and footer.
  reason: Marks AI-generated code as public domain.
  paths:
  - interface/forms/newpatient/templates/newpatient/common.html.twig
- value: Public domain - Note this questionnaire was generated using Claude.AI and is in the public domain.
  reason: AI-generated questionnaire template in the public domain.
  paths:
  - templates/api/smart/dsi-service-questionnaire.json.twig

exempt:
- reason: Generated by PHPFHIR from the HL7 FHIR definitions.
  paths:
  - src/FHIR/R4/*
- reason: Generated documentation, including bundled SchemaSpy assets.
  paths:
  - Documentation/*
- reason: Generated PHPStan baseline.
  paths:
  - .phpstan/baseline/*
- reason: Test fixtures are data; a header would change what the tests compare.
  paths:
  - tests/*/fixtures/*
- reason: Minified build output and libraries.
  paths:
  - '*.min.js'
  - '*.min.css'
- reason: Bundled third-party front-end assets.
  paths:
  - public/assets/*
  - swagger/*
  - library/js/vendors/*
  - library/js/dwv/*
  - interface/forms/eye_mag/js/jquery-*
  - interface/forms/eye_mag/js/shortcut.js-*
  - interface/modules/zend_modules/public/css/bootstrap*
  - interface/modules/zend_modules/public/css/jquery*
  - interface/modules/zend_modules/public/js/lib/*
  - library/js/u2f-api.js
  - interface/super/rules/www/css/cdr-multiselect/*
  - interface/super/rules/www/js/cdr-multiselect/*
  - portal/patient/scripts/libs/*
  - portal/sign/assets/*
- reason: Bootstrap source imported into the compact themes.
  paths:
  - interface/themes/oemr_compact_imports.scss
  - interface/themes/oemr_rtl_compact_imports.scss
- reason: Webpack build output.
  paths:
  - interface/modules/custom_modules/oe-module-comlink-telehealth/public/assets/js/dist/*
- reason: Phreeze framework and Savant templates, bundled third-party code.
  paths:
  - portal/patient/fwk/libs/*
- reason: phpGACL, bundled third-party code.
  paths:
  - gacl/*
- reason: Smarty plugins, bundled third-party code.
  paths:
  - library/smarty/*
- reason: FPDF, bundled third-party code.
  paths:
  - library/classes/fpdf/*
- reason: PEAR HTML_TreeMenu, bundled third-party code.
  paths:
  - library/classes/TreeMenu.php
  - library/js/CategoryTreeMenu.js
  - library/js/DocumentTreeMenu.js
- reason: Derived from jumbojett/OpenID-Connect-PHP and kept under its Apache 2.0 license.
  paths:
  - src/Common/Auth/OpenIDConnect/JWT/RsaSha384Signer.php
- reason: PostNuke and PostCalendar, bundled third-party code.
  paths:
  - interface/main/calendar/includes/*
  - interface/main/calendar/modules/PostCalendar/*
