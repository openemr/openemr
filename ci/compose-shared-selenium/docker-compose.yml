services:
  selenium:
    image: selenium/standalone-chromium:152.0.7977.82@sha256:08fd293648e126275782c616a61f4ee1d90cf413b1972ebc35dbd054d6789f55
    # Services with profiles don't start by default.
    profiles:
    - selenium
    - video-recording
    ports:
    - 4444:4444  # Selenium WebDriver interface
    environment:
      SE_SCREEN_WIDTH: 1920
      SE_SCREEN_HEIGHT: 1080
      SE_SCREEN_DEPTH: 24
      SE_START_XVFB: true
    volumes:
    - /dev/shm:/dev/shm
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:4444/wd/hub/status
      start_period: 30s
      interval: 30s
      timeout: 5s
      retries: 3
  video:
    image: selenium/video:ffmpeg-7.1-20250808@sha256:c418f6e20e3496c393ad501a0f599813e08d50dc8b88ffb00fb6727bc7bd8aa3
    # Services with profiles don't start by default.
    profiles:
    - video-recording
    depends_on:
    - selenium
    environment:
      DISPLAY_CONTAINER_NAME: selenium
  openemr:
    environment:
      SELENIUM_USE_GRID: "true"
      SELENIUM_HOST: selenium
      SELENIUM_FORCE_HEADLESS: "false"
