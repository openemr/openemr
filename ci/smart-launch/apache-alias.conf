# Apache alias for the SMART-launch smoke (openemr/openemr#14529).
#
# Serves the extracted oe-smart-questionnaire app's public/ directory at
# /smart-questionnaire. The rest of the app tree (src/, bin/, var/,
# config.php) lives outside the alias target, so Apache cannot serve
# var/clients.json (which contains client_secret + registration_access_token).
#
# Both HTTP (:80) and HTTPS (:443) listeners pick this up because flex's
# httpd.conf includes conf.d/*.conf at global scope (above the VirtualHost
# blocks). HTTPS is the operational path — authserverOpenEMR cookie is
# Secure+SameSite=None which browsers only send on HTTPS.
Alias /smart-questionnaire /opt/oe-smart-questionnaire/app/public
<Directory /opt/oe-smart-questionnaire/app/public>
    AllowOverride None
    Require all granted
    Options -Indexes
    DirectoryIndex launch.php index.php
</Directory>
